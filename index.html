<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHICAGO Setlist Builder</title>
    <!-- 緑がかったネイビー背景に淡いゴールドの「DDM」ファビコン -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231A2B3C%22/><text x=%2250%22 y=%2265%22 font-family=%22Impact, Arial, sans-serif%22 font-size=%2238%22 text-anchor=%22middle%22 fill=%22%23D8C38E%22>DDM</text></svg>">
    
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (アイコン用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React (アプリの心臓部) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* アニメーションと基本設定 */
        body { -webkit-tap-highlight-color: transparent; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 印刷（A4・1枚）の極限最適化レイアウト */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background-color: white !important; margin: 0 !important; color: black !important; }
            .print-hidden { display: none !important; }
            .print-only { display: flex !important; }
            
            /* 1枚にピタッと収め、行間を最大化する魔法のフレックスボックス */
            #print-container {
                display: flex;
                flex-direction: column;
                min-height: 270mm; /* 16曲以上の時は伸びるようにmin-heightに変更 */
                width: 100%;
            }
            .print-header { flex-shrink: 0; margin-bottom: 5mm; }
            .print-table-container {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                border: 2px solid black;
            }
            
            .print-extra { color: #666; font-style: italic; background-color: #f9f9f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;}
        }
        .print-only { display: none; }

        /* --- 指定比率のグリッドレイアウト --- */
        .print-grid-row {
            display: grid;
            grid-template-columns: 8% 60% 6% 10% 8% 8%;
            grid-template-rows: 1fr auto; 
            flex-grow: 1;
            min-height: 16mm; /* 15曲までは均等に伸び、16曲以上は2ページ目に溢れるよう設定 */
            page-break-inside: avoid;
            border-bottom: 1px solid #444;
        }
        .print-grid-row:last-child { border-bottom: none; }
        
        .pg-no { grid-column: 1; grid-row: 1 / 3; display: flex; align-items: center; justify-content: center; border-right: 1px solid #444; font-size: 1.4rem; font-weight: bold; }
        .pg-title { grid-column: 2; grid-row: 1; display: flex; align-items: center; padding: 0 10px; border-right: 1px solid #444; }
        .pg-key { grid-column: 3; grid-row: 1; display: flex; align-items: center; justify-content: center; border-right: 1px solid #444; font-size: 1.4rem; font-weight: bold; }
        .pg-harp { grid-column: 4; grid-row: 1; display: flex; align-items: center; justify-content: center; border-right: 1px solid #444; font-size: 1.4rem; font-weight: bold; }
        .pg-bpm { grid-column: 5; grid-row: 1; display: flex; align-items: center; justify-content: center; border-right: 1px solid #444; font-size: 1.4rem; font-weight: bold; }
        .pg-time { grid-column: 6; grid-row: 1; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; }
        
        /* 備考欄（タイトルからTimeの最後まで横幅いっぱい使う） */
        .pg-memo {
            grid-column: 2 / 7;
            grid-row: 2;
            padding: 2px 10px 4px 10px;
            font-size: 1.1rem;
            color: #333;
            white-space: pre-wrap;
            line-height: 1.2;
        }

        /* ヘッダー用 */
        .print-grid-header {
            display: grid;
            grid-template-columns: 8% 60% 6% 10% 8% 8%;
            background-color: #e5e7eb;
            border-bottom: 2px solid black;
            height: 35px;
        }
        .print-grid-header > div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-right: 1px solid #444;
        }
        .print-grid-header > div:last-child {
            border-right: none;
        }

        .print-song-title { font-size: 1.6rem; font-weight: bold; width: 100%; line-height: 1.1; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FALLBACK_DATA = [
            { 楽曲名: "25 or 6 to 4", Key: "Am", "Harp (Pos)": "", BPM: "150", Time: "4:50", "備考・演奏指示": "" },
            { 楽曲名: "Saturday in the Park", Key: "C", "Harp (Pos)": "C", BPM: "114", Time: "3:56", "備考・演奏指示": "ピアノから" },
            { 楽曲名: "Hard to Say I'm Sorry", Key: "E", "Harp (Pos)": "", BPM: "72", Time: "3:48", "備考・演奏指示": "バラード" },
            { 楽曲名: "If You Leave Me Now", Key: "B", "Harp (Pos)": "", BPM: "100", Time: "3:55", "備考・演奏指示": "" },
            { 楽曲名: "Does Anybody Really Know What Time It Is?", Key: "C", "Harp (Pos)": "", BPM: "112", Time: "4:36", "備考・演奏指示": "ホーンセクション" },
            { 楽曲名: "Beginnings", Key: "A", "Harp (Pos)": "A", BPM: "120", Time: "7:54", "備考・演奏指示": "アコギ" },
            { 楽曲名: "Make Me Smile", Key: "E", "Harp (Pos)": "", BPM: "130", Time: "3:01", "備考・演奏指示": "" },
            { 楽曲名: "Colour My World", Key: "F", "Harp (Pos)": "", BPM: "60", Time: "3:03", "備考・演奏指示": "フルート" },
            { 楽曲名: "Just You 'n' Me", Key: "C", "Harp (Pos)": "", BPM: "90", Time: "3:42", "備考・演奏指示": "" },
            { 楽曲名: "Feelin' Stronger Every Day", Key: "D", "Harp (Pos)": "", BPM: "120", Time: "4:15", "備考・演奏指示": "アップテンポ" }
        ].map((song, i) => ({ ...song, id: `song_${i}` }));

        const parseCSV = (text) => {
            const parseLine = (line) => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current);
                return result.map(s => s.trim().replace(/^"|"$/g, ''));
            };

            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return [];
            const headers = parseLine(lines[0]);
            
            return lines.slice(1).map((line, idx) => {
                const values = parseLine(line);
                const obj = { id: `csv_${idx}` };
                headers.forEach((header, index) => {
                    obj[header] = values[index] !== undefined ? values[index] : '';
                });
                
                obj['楽曲名'] = obj['楽曲名'] || obj['曲名'] || values[0] || '';
                obj['Key'] = obj['Key'] || obj['キー'] || values[1] || '';
                obj['Time'] = obj['Time'] || obj['時間'] || values[2] || ''; 
                obj['Harp (Pos)'] = obj['Harp (Pos)'] || obj['Harp'] || obj['ハーモニカ'] || values[3] || '';
                obj['備考・演奏指示'] = obj['備考・演奏指示'] || obj['備考'] || obj['指示'] || values[4] || '';
                obj['BPM'] = obj['BPM'] || obj['テンポ'] || values[5] || ''; 
                
                return obj;
            });
        };

        const timeToSeconds = (timeStr) => {
            if (!timeStr) return 0;
            const parts = String(timeStr).split(':');
            if (parts.length === 2) {
                return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            }
            return parseInt(timeStr, 10) || 0;
        };

        const secondsToTime = (seconds) => {
            if (isNaN(seconds) || seconds <= 0) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        };

        // Harpのカッコ表記を2段化するコンポーネント
        const renderHarpCell = (harpText) => {
            if (!harpText) return null;
            const match = harpText.match(/^(.*?)\s*(\(.*?\))$/);
            if (match) {
                return (
                    <div className="flex flex-col items-center justify-center leading-none">
                        <span>{match[1]}</span>
                        <span style={{ fontSize: '0.7em', marginTop: '2px' }}>{match[2]}</span>
                    </div>
                );
            }
            return <span>{harpText}</span>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('search');
            const [masterData, setMasterData] = useState([]);
            const [setlist, setSetlist] = useState([]);
            const [mainCount, setMainCount] = useState(10);
            const [extraCount, setExtraCount] = useState(3);
            const [toastMessage, setToastMessage] = useState('');
            const [previewScale, setPreviewScale] = useState(1);
            
            const [showHelp, setShowHelp] = useState(false);
            const [editingNoteIndex, setEditingNoteIndex] = useState(null);
            const [tempNoteText, setTempNoteText] = useState("");

            const dragItem = useRef(null);
            const dragOverItem = useRef(null);
            const previewWrapperRef = useRef(null);

            useEffect(() => {
                const updateScale = () => {
                    if (activeTab === 'preview' && previewWrapperRef.current) {
                        const wrapperWidth = previewWrapperRef.current.clientWidth;
                        const a4WidthPx = 794; 
                        if (wrapperWidth < a4WidthPx) {
                            setPreviewScale(wrapperWidth / a4WidthPx);
                        } else {
                            setPreviewScale(1);
                        }
                    }
                };
                
                setTimeout(updateScale, 10);
                window.addEventListener('resize', updateScale);
                return () => window.removeEventListener('resize', updateScale);
            }, [activeTab]);

            useEffect(() => {
                fetch('master_data.csv')
                    .then(response => {
                        if (!response.ok) throw new Error('CSVが見つかりません');
                        return response.text();
                    })
                    .then(text => {
                        const data = parseCSV(text);
                        setMasterData(data.length > 0 ? data : FALLBACK_DATA);
                    })
                    .catch(() => {
                        setMasterData(FALLBACK_DATA);
                    });
            }, []);

            const showToast = (message) => {
                setToastMessage(message);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const toggleSong = (song) => {
                const isSelected = setlist.some(s => s.id === song.id);
                if (isSelected) {
                    setSetlist(setlist.filter(s => s.id !== song.id));
                    showToast(`「${song.楽曲名 || song.曲名}」を削除しました`);
                } else {
                    setSetlist([...setlist, { ...song, uniqueId: Date.now() + Math.random() }]);
                    showToast(`「${song.楽曲名 || song.曲名}」を追加しました`);
                }
            };

            const updateSetlistField = (index, field, value) => {
                const newList = [...setlist];
                newList[index][field] = value;
                setSetlist(newList);
            };

            // 順番移動（画面スクロール追従機能付き）
            const moveRow = (index, direction) => {
                if (direction === -1 && index === 0) return;
                if (direction === 1 && index === setlist.length - 1) return;
                
                const itemUniqueId = setlist[index].uniqueId;
                const itemEl = document.getElementById(`song-row-${itemUniqueId}`);
                let prevTop = 0;
                if (itemEl) prevTop = itemEl.getBoundingClientRect().top;

                const newList = [...setlist];
                const item = newList.splice(index, 1)[0];
                newList.splice(index + direction, 0, item);
                setSetlist(newList);

                // レンダリング直後に要素の新しい位置を計算し、画面のズレを補正する
                if (itemEl) {
                    requestAnimationFrame(() => {
                        const newItemEl = document.getElementById(`song-row-${itemUniqueId}`);
                        if (newItemEl) {
                            const newTop = newItemEl.getBoundingClientRect().top;
                            const diff = newTop - prevTop;
                            window.scrollBy(0, diff);
                        }
                    });
                }
            };

            const handleSort = () => {
                if (dragItem.current === null || dragOverItem.current === null) return;
                const newList = [...setlist];
                const draggedItem = newList.splice(dragItem.current, 1)[0];
                newList.splice(dragOverItem.current, 0, draggedItem);
                dragItem.current = null;
                dragOverItem.current = null;
                setSetlist(newList);
            };

            const saveNote = () => {
                if (editingNoteIndex !== null) {
                    updateSetlistField(editingNoteIndex, '備考・演奏指示', tempNoteText);
                }
                setEditingNoteIndex(null);
            };

            const calculateTotalTime = () => {
                const mainSongs = setlist.slice(0, mainCount);
                const totalSeconds = mainSongs.reduce((acc, song) => acc + timeToSeconds(song.Time || song.時間), 0);
                return secondsToTime(totalSeconds);
            };

            // 15曲オーバー警告付きプリント
            const handlePrint = () => {
                const totalPrintCount = mainCount + extraCount;
                if (totalPrintCount >= 16) {
                    alert("16曲以上は2枚になります。");
                }
                window.print();
            };

            // 曲数設定 (ボタン式に改良)
            const renderCountSettings = () => (
                <div className="bg-gray-50 border border-gray-200 rounded-lg p-2 md:p-4 mb-3 flex flex-col md:flex-row items-center justify-between gap-2">
                    <div className="font-bold text-gray-700 flex items-center text-sm md:text-base">
                        <i className="fas fa-music mr-2 text-red-600"></i>
                        現在 {setlist.length} 曲選択中
                    </div>
                    <div className="flex space-x-3 md:space-x-4">
                        <div className="flex items-center">
                            <label className="text-xs md:text-sm font-bold text-gray-600 mr-1 md:mr-2">本番枠:</label>
                            <div className="flex items-center border border-gray-300 rounded overflow-hidden shadow-sm bg-white">
                                <button onClick={() => setMainCount(Math.max(1, mainCount - 1))} className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 border-r"><i className="fas fa-minus text-[10px] md:text-xs"></i></button>
                                <div className="w-6 md:w-8 text-center font-bold text-sm md:text-base text-red-600">{mainCount}</div>
                                <button onClick={() => setMainCount(Math.min(30, mainCount + 1))} className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 border-l"><i className="fas fa-plus text-[10px] md:text-xs"></i></button>
                            </div>
                        </div>
                        <div className="flex items-center">
                            <label className="text-xs md:text-sm font-bold text-gray-600 mr-1 md:mr-2">予備枠:</label>
                            <div className="flex items-center border border-gray-300 rounded overflow-hidden shadow-sm bg-white">
                                <button onClick={() => setExtraCount(Math.max(0, extraCount - 1))} className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 border-r"><i className="fas fa-minus text-[10px] md:text-xs"></i></button>
                                <div className="w-6 md:w-8 text-center font-bold text-sm md:text-base text-gray-600">{extraCount}</div>
                                <button onClick={() => setExtraCount(Math.min(10, extraCount + 1))} className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 border-l"><i className="fas fa-plus text-[10px] md:text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // --- タブ1: 楽曲選択 ---
            const renderSearchTab = () => (
                <div className="animate-fade-in print-hidden">
                    {renderCountSettings()}
                    
                    <div className="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
                        <div className="bg-red-50 px-3 py-2 border-b border-red-100 flex justify-between items-center">
                            <h2 className="text-xs md:text-sm font-bold text-red-800">マスターデータから選ぶ</h2>
                            <span className="text-[10px] md:text-xs text-red-600">※タップして追加/削除</span>
                        </div>
                        
                        <div className="overflow-y-auto" style={{ maxHeight: '65vh' }}>
                            <ul className="divide-y divide-gray-100">
                                {masterData.map((song) => {
                                    const isSelected = setlist.some(s => s.id === song.id);
                                    return (
                                        <li key={song.id} 
                                            onClick={() => toggleSong(song)}
                                            className={`px-3 py-1.5 md:p-3 flex items-center justify-between cursor-pointer transition-colors ${isSelected ? 'bg-red-50' : 'hover:bg-gray-50'}`}
                                        >
                                            <div className="flex-1 pr-2">
                                                <div className={`font-bold text-sm md:text-base ${isSelected ? 'text-red-700' : 'text-gray-800'}`}>
                                                    {song.楽曲名 || song.曲名}
                                                </div>
                                            </div>
                                            <div>
                                                {isSelected ? (
                                                    <button className="px-2 py-1 md:px-3 bg-gray-200 text-gray-600 font-bold rounded text-xs flex items-center shadow-inner">
                                                        <i className="fas fa-check mr-1"></i> 削除
                                                    </button>
                                                ) : (
                                                    <button className="px-2 py-1 md:px-3 bg-red-600 text-white font-bold rounded text-xs flex items-center shadow shadow-red-200 active:bg-red-700">
                                                        <i className="fas fa-plus mr-1"></i> 追加
                                                    </button>
                                                )}
                                            </div>
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>
                    </div>
                </div>
            );

            // --- タブ2: セトリ編集 (スマホ超高圧縮版) ---
            const renderEditTab = () => (
                <div className="animate-fade-in print-hidden">
                    {renderCountSettings()}

                    {setlist.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-lg border border-gray-200">
                            <i className="fas fa-list-ul text-3xl text-gray-300 mb-3"></i>
                            <p className="text-gray-500 font-medium text-sm">まだ曲が選ばれていません。<br/>「曲を選ぶ」タブから追加してください。</p>
                        </div>
                    ) : (
                        <div className="space-y-1">
                            {setlist.map((song, index) => {
                                const isExtra = index >= mainCount;
                                return (
                                    <React.Fragment key={song.uniqueId}>
                                        {/* 予備境界線 (重ならないようにブロック要素で配置) */}
                                        {index === mainCount && (
                                            <div className="w-full flex justify-center py-1.5 print-hidden">
                                                <span className="bg-gray-800 text-white text-[10px] font-bold px-3 py-0.5 rounded-full shadow-md">🛑 ここから予備曲</span>
                                            </div>
                                        )}

                                        <div 
                                            id={`song-row-${song.uniqueId}`}
                                            draggable
                                            onDragStart={() => (dragItem.current = index)}
                                            onDragEnter={() => (dragOverItem.current = index)}
                                            onDragEnd={handleSort}
                                            onDragOver={(e) => e.preventDefault()}
                                            className={`bg-white border rounded shadow-sm overflow-hidden flex flex-col transition-all ${isExtra ? 'border-gray-200 bg-gray-50 opacity-80' : 'border-red-100'}`}
                                        >
                                            {/* 上段: 基本情報とパラメータ */}
                                            <div className="p-0.5 md:p-2 flex flex-col md:flex-row gap-0 md:gap-2 items-start md:items-end">
                                                
                                                {/* 左側: 操作と曲名 */}
                                                <div className="flex items-center w-full md:w-auto md:flex-1 py-0.5 md:py-0">
                                                    {/* PC用: ドラッグハンドル */}
                                                    <div className="hidden md:flex text-gray-300 p-1 cursor-grab mr-1">
                                                        <i className="fas fa-grip-vertical text-lg"></i>
                                                    </div>

                                                    {/* スマホ用: 矢印ボタン (極小・隙間ゼロ) */}
                                                    <div className="md:hidden flex flex-col space-y-0 mr-1">
                                                        <button onClick={() => moveRow(index, -1)} disabled={index === 0} className={`px-1.5 py-0 rounded bg-gray-100 text-gray-600 ${index === 0 ? 'opacity-30' : 'active:bg-gray-200'}`}><i className="fas fa-arrow-up text-[8px]"></i></button>
                                                        <button onClick={() => moveRow(index, 1)} disabled={index === setlist.length - 1} className={`px-1.5 py-0 rounded bg-gray-100 text-gray-600 ${index === setlist.length - 1 ? 'opacity-30' : 'active:bg-gray-200'}`}><i className="fas fa-arrow-down text-[8px]"></i></button>
                                                    </div>

                                                    <div className="w-5 flex-shrink-0 text-center font-black text-xs md:text-base text-gray-400 mr-1">
                                                        {isExtra ? '予' : index + 1}
                                                    </div>
                                                    
                                                    <div className="flex-1 font-bold text-sm md:text-base text-gray-800 leading-none pr-1 truncate">
                                                        {song.楽曲名 || song.曲名}
                                                    </div>

                                                    {/* スマホ用: 行削除ボタン */}
                                                    <button 
                                                        onClick={() => {
                                                            const newList = setlist.filter((_, i) => i !== index);
                                                            setSetlist(newList);
                                                            showToast(`削除しました`);
                                                        }}
                                                        className="md:hidden ml-auto flex-shrink-0 w-6 h-6 flex items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-100 active:bg-red-200 transition-colors"
                                                    >
                                                        <i className="fas fa-trash-alt text-[10px]"></i>
                                                    </button>
                                                </div>

                                                {/* 右側(PC) / 2段目(スマホ): パラメータ群 (スマホ比率: Key15:Harp56:BPM12:Time17) */}
                                                <div className="grid grid-cols-[15fr_56fr_12fr_17fr] md:flex items-end gap-0.5 w-full md:w-auto px-1 md:px-0 mb-0.5 md:mb-0">
                                                    {/* Key入力 */}
                                                    <div className="md:w-10">
                                                        <label className="block text-[8px] md:text-[9px] font-bold text-gray-500 mb-0 md:mb-0.5 text-center leading-none">Key</label>
                                                        <input type="text" value={song.Key || ''} onChange={(e) => updateSetlistField(index, 'Key', e.target.value)} className="w-full px-0.5 py-0 md:py-1 border rounded bg-white text-[9px] md:text-xs font-bold text-center focus:ring-2 focus:ring-red-200 outline-none h-4 md:h-auto leading-none" />
                                                    </div>
                                                    {/* ハーモニカ入力 (比率一番大きい) */}
                                                    <div className="md:w-16">
                                                        <label className="block text-[8px] md:text-[9px] font-bold text-gray-500 mb-0 md:mb-0.5 text-center leading-none">Harp</label>
                                                        <input type="text" value={song["Harp (Pos)"] || song.Harp || ''} onChange={(e) => updateSetlistField(index, 'Harp (Pos)', e.target.value)} className="w-full px-0.5 py-0 md:py-1 border rounded bg-white text-[9px] md:text-xs font-bold text-center focus:ring-2 focus:ring-red-200 outline-none h-4 md:h-auto leading-none" />
                                                    </div>
                                                    {/* BPM入力 */}
                                                    <div className="md:w-14">
                                                        <label className="block text-[8px] md:text-[9px] font-bold text-gray-500 mb-0 md:mb-0.5 text-center leading-none">BPM</label>
                                                        <input type="text" value={song.BPM || ''} onChange={(e) => updateSetlistField(index, 'BPM', e.target.value)} className="w-full px-0.5 py-0 md:py-1 border rounded bg-white text-[9px] md:text-xs font-bold text-center focus:ring-2 focus:ring-red-200 outline-none h-4 md:h-auto leading-none" />
                                                    </div>
                                                    {/* Time入力 */}
                                                    <div className="md:w-14">
                                                        <label className="block text-[8px] md:text-[9px] font-bold text-gray-500 mb-0 md:mb-0.5 text-center leading-none">Time</label>
                                                        <input type="text" value={song.Time || ''} onChange={(e) => updateSetlistField(index, 'Time', e.target.value)} className="w-full px-0.5 py-0 md:py-1 border rounded bg-white text-[9px] md:text-xs font-bold text-center focus:ring-2 focus:ring-red-200 outline-none h-4 md:h-auto leading-none" />
                                                    </div>
                                                    
                                                    {/* PC用: 行削除ボタン */}
                                                    <button 
                                                        onClick={() => {
                                                            const newList = setlist.filter((_, i) => i !== index);
                                                            setSetlist(newList);
                                                            showToast(`削除しました`);
                                                        }}
                                                        className="hidden md:flex ml-1 w-8 h-8 items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-100 active:bg-red-200 transition-colors flex-shrink-0"
                                                    >
                                                        <i className="fas fa-trash-alt text-xs"></i>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* 下段: 備考（極限まで高さを削る） */}
                                            <div className="px-1 pb-1 pt-0 bg-gray-50 border-t border-gray-100">
                                                <div 
                                                    onClick={() => {
                                                        setTempNoteText(song["備考・演奏指示"] || song.備考 || '');
                                                        setEditingNoteIndex(index);
                                                    }}
                                                    className="w-full px-1 py-0 md:py-1 border border-gray-300 rounded bg-white text-[9px] md:text-xs text-gray-700 truncate cursor-text hover:bg-gray-100 transition-colors h-4 md:h-auto flex items-center"
                                                >
                                                    {song["備考・演奏指示"] || song.備考 ? (
                                                        <span className="truncate w-full block leading-none">{song["備考・演奏指示"] || song.備考}</span>
                                                    ) : (
                                                        <span className="text-gray-400 italic leading-none">タップして指示を入力...</span>
                                                    )}
                                                </div>
                                            </div>

                                        </div>
                                    </React.Fragment>
                                );
                            })}
                        </div>
                    )}

                    {/* 備考欄 大画面編集モーダル (スマホでは上半分に完全固定) */}
                    {editingNoteIndex !== null && (
                        <div className="fixed inset-0 z-50 flex items-start justify-center bg-black bg-opacity-60 animate-fade-in p-0 md:p-4 print-hidden">
                            <div className="bg-white w-full md:w-[500px] h-[50vh] max-h-[50vh] md:max-h-none md:h-auto rounded-b-2xl md:rounded-2xl flex flex-col shadow-2xl">
                                <div className="p-2 md:p-3 border-b border-gray-200 flex justify-between items-center bg-gray-50 md:rounded-t-2xl">
                                    <h3 className="font-bold text-gray-800 text-sm md:text-base">
                                        <i className="fas fa-edit mr-2 text-red-600"></i>
                                        備考・演奏指示を編集
                                    </h3>
                                    <button onClick={() => setEditingNoteIndex(null)} className="text-gray-400 hover:text-gray-600 px-2 py-1"><i className="fas fa-times text-lg"></i></button>
                                </div>
                                <div className="p-2 md:p-3 flex-grow">
                                    <textarea 
                                        value={tempNoteText}
                                        onChange={(e) => setTempNoteText(e.target.value)}
                                        placeholder="ここに演奏の注意点やきっかけを自由に書き込んでください..."
                                        className="w-full h-full p-2 md:p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-200 focus:border-red-400 outline-none resize-none text-sm md:text-base"
                                        autoFocus
                                    ></textarea>
                                </div>
                                <div className="p-2 md:p-3 border-t border-gray-200">
                                    <button onClick={saveNote} className="w-full py-2 md:py-3 bg-red-600 text-white font-bold text-sm md:text-base rounded-lg active:bg-red-700 shadow-md flex justify-center items-center">
                                        <i className="fas fa-check-circle mr-2"></i> 保存して閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            // --- タブ3: 印刷・PDFプレビュー ---
            const renderPreviewTab = () => (
                <div className="animate-fade-in">
                    <div className="print-hidden mb-6">
                        <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-200 text-center">
                            <h2 className="text-xl md:text-2xl font-black text-gray-800 mb-1">準備完了！</h2>
                            <p className="text-xs md:text-sm text-gray-600 mb-4">A4用紙1枚に見やすく最適化されたセトリを出力します。</p>
                            
                            <div className="flex justify-center mb-4">
                                <div className="bg-red-50 border border-red-100 rounded-lg p-3 inline-flex items-center space-x-4 md:space-x-6">
                                    <div>
                                        <span className="block text-[10px] md:text-xs font-bold text-red-800 opacity-70 mb-0.5">本番曲のTotal Time (約)</span>
                                        <span className="text-xl md:text-3xl font-black text-red-600">{calculateTotalTime()}</span>
                                    </div>
                                    <div className="h-8 w-px bg-red-200"></div>
                                    <div>
                                        <span className="block text-[10px] md:text-xs font-bold text-red-800 opacity-70 mb-0.5">曲数設定</span>
                                        <span className="text-sm md:text-lg font-bold text-gray-700">本番{mainCount}曲 / 予備{extraCount}曲</span>
                                    </div>
                                </div>
                            </div>

                            <button 
                                onClick={handlePrint}
                                disabled={setlist.length === 0}
                                className="w-full md:w-auto md:px-12 py-3 md:py-4 bg-red-600 text-white font-bold text-base md:text-lg rounded-xl shadow-lg hover:bg-red-700 active:scale-95 transition-transform disabled:bg-gray-300 flex items-center justify-center mx-auto"
                            >
                                <i className="fas fa-print mr-2 text-lg"></i>
                                PDFに保存 / 印刷する
                            </button>
                            <p className="text-[10px] md:text-xs text-gray-500 mt-2 font-bold">※ボタンを押して「PDFとして保存」を選んでLINEで共有してください。</p>
                        </div>

                        {/* --- 画面上の印刷プレビュー (オートスケール対応) --- */}
                        <div className="bg-gray-200 p-2 md:p-4 rounded-xl shadow-inner mb-6 flex flex-col items-center overflow-hidden">
                            <p className="text-center text-xs md:text-sm font-bold text-gray-500 mb-2 w-full">
                                <i className="fas fa-eye mr-1"></i> A4用紙 出力プレビュー
                            </p>
                            
                            {/* スケール基準となるラッパー */}
                            <div ref={previewWrapperRef} className="w-full flex justify-center">
                                {/* A4のアスペクト比を維持しつつ、スケールで縮小させる箱 */}
                                <div style={{ 
                                    width: `${794 * previewScale}px`, 
                                    height: `${1122 * previewScale}px`, 
                                    position: 'relative' 
                                }}>
                                    {/* 実際のA4サイズのレイアウト (transformで縮小表示) */}
                                    <div className="bg-white shadow-md text-black font-sans absolute top-0 left-0" 
                                         style={{ 
                                             width: '794px',   /* A4幅 210mm の近似ピクセル */
                                             height: '1122px', /* A4高 297mm の近似ピクセル */
                                             padding: '38px',  /* 余白 10mm の近似ピクセル */
                                             transformOrigin: 'top left',
                                             transform: `scale(${previewScale})` 
                                         }}>
                                        <div className="text-center border-b-4 border-black pb-2 mb-4 h-full flex flex-col">
                                            {/* タイトルを text-2xl に縮小 */}
                                            <h1 className="text-2xl font-black tracking-widest uppercase flex-shrink-0">LIVE SETLIST - CHICAGO</h1>
                                            <div className="flex justify-between mt-2 font-bold text-lg px-2 flex-shrink-0">
                                                <div>本番曲のTotal Time: {calculateTotalTime()}</div>
                                                <div>Date: ___ / ___ / ______</div>
                                            </div>
                                            
                                            {/* メインテーブル領域 */}
                                            <div className="flex flex-col border-2 border-black flex-grow mt-4">
                                                {/* ヘッダー */}
                                                <div className="print-grid-header flex-shrink-0">
                                                    <div>#</div>
                                                    <div>楽曲名</div>
                                                    <div>Key</div>
                                                    <div>Harp</div>
                                                    <div>BPM</div>
                                                    <div>Time</div>
                                                </div>

                                                {/* データ行 */}
                                                {setlist.slice(0, mainCount + extraCount).map((song, i) => {
                                                    const isExtra = i >= mainCount;
                                                    return (
                                                        <div key={i} className={`print-grid-row ${isExtra ? 'bg-gray-50 text-gray-600 italic print-extra' : ''}`}>
                                                            <div className="pg-no">{isExtra ? '予' : i + 1}</div>
                                                            <div className="pg-title"><div className="print-song-title">{song.楽曲名 || song.曲名}</div></div>
                                                            <div className="pg-key">{song.Key}</div>
                                                            <div className="pg-harp">{renderHarpCell(song["Harp (Pos)"] || song.Harp)}</div>
                                                            <div className="pg-bpm">{song.BPM}</div>
                                                            <div className="pg-time">{song.Time || song.時間}</div>
                                                            
                                                            {/* 備考（下段フル幅） */}
                                                            {(song["備考・演奏指示"] || song.備考) && (
                                                                <div className="pg-memo">
                                                                    &gt;&gt;&gt; {song["備考・演奏指示"] || song.備考}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* --- 実際の印刷用 A4フルレイアウト (画面上では隠れ、印刷時のみ展開) --- */}
                    <div className="print-only flex-col w-full bg-white text-black font-sans" id="print-container">
                        <div className="print-header text-center border-b-4 border-black pb-2">
                            {/* タイトルを text-2xl に縮小 */}
                            <h1 className="text-2xl font-black tracking-widest uppercase">LIVE SETLIST - CHICAGO</h1>
                            <div className="flex justify-between mt-2 font-bold text-lg px-2">
                                <div>本番曲のTotal Time: {calculateTotalTime()}</div>
                                <div>Date: ___ / ___ / ______</div>
                            </div>
                        </div>

                        <div className="print-table-container">
                            
                            {/* 新しいグリッドヘッダー */}
                            <div className="print-grid-header">
                                <div>#</div>
                                <div>楽曲名</div>
                                <div>Key</div>
                                <div>Harp</div>
                                <div>BPM</div>
                                <div>Time</div>
                            </div>

                            {/* データ行（行の高さは自動的に均等拡大、16曲以上は2枚目へ） */}
                            {setlist.slice(0, mainCount + extraCount).map((song, i) => {
                                const isExtra = i >= mainCount;
                                return (
                                    <div key={i} className={`print-grid-row ${isExtra ? 'print-extra' : ''}`}>
                                        <div className="pg-no">{isExtra ? '予' : i + 1}</div>
                                        <div className="pg-title"><div className="print-song-title">{song.楽曲名 || song.曲名}</div></div>
                                        <div className="pg-key">{song.Key}</div>
                                        <div className="pg-harp">{renderHarpCell(song["Harp (Pos)"] || song.Harp)}</div>
                                        <div className="pg-bpm">{song.BPM}</div>
                                        <div className="pg-time">{song.Time || song.時間}</div>
                                        
                                        {/* 備考（下段フル幅） */}
                                        {(song["備考・演奏指示"] || song.備考) && (
                                            <div className="pg-memo">
                                                &gt;&gt;&gt; {song["備考・演奏指示"] || song.備考}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            // --- ヘルプモーダル (70歳でもわかる説明) ---
            const renderHelpModal = () => (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-70 p-4 animate-fade-in print-hidden">
                    <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-full">
                        <div className="bg-gray-800 text-white p-3 md:p-4 flex justify-between items-center">
                            <h2 className="text-lg md:text-xl font-bold"><i className="fas fa-question-circle mr-2"></i>使い方の案内</h2>
                            <button onClick={() => setShowHelp(false)} className="text-gray-300 hover:text-white px-2"><i className="fas fa-times text-xl"></i></button>
                        </div>
                        <div className="p-4 md:p-6 overflow-y-auto space-y-4 md:space-y-6 text-gray-800 text-sm md:text-base leading-relaxed">
                            
                            <div className="bg-red-50 p-3 md:p-4 rounded-xl border border-red-100">
                                <h3 className="font-bold text-red-800 text-base md:text-lg mb-2">1. セトリの作り方</h3>
                                <ul className="list-disc pl-5 space-y-1 md:space-y-2">
                                    <li><b>「曲を選ぶ」タブ:</b> 追加ボタンを押して、今日やる曲を選びます。</li>
                                    <li><b>「編集・並べ替え」タブ:</b> スマホ版は矢印、PC版はドラッグして順番を入れ替えられます。キーやメモもここで書き換えできます。</li>
                                </ul>
                            </div>

                            <div className="bg-blue-50 p-3 md:p-4 rounded-xl border border-blue-100">
                                <h3 className="font-bold text-blue-800 text-base md:text-lg mb-2">2. メンバーにLINEで送る方法</h3>
                                <ol className="list-decimal pl-5 space-y-1 md:space-y-2">
                                    <li>「PDF・印刷」タブを開きます。</li>
                                    <li><b>「PDFに保存 / 印刷する」</b>の赤いボタンを押します。</li>
                                    <li>スマホの画面に「PDFとして保存（またはプリント）」と出るので、そのまま保存します。</li>
                                    <li>保存したPDFファイルを、バンドのグループLINEに送れば完了です！</li>
                                </ol>
                            </div>

                            <div className="bg-yellow-50 p-3 md:p-4 rounded-xl border border-yellow-200">
                                <h3 className="font-bold text-yellow-800 text-base md:text-lg mb-2">⚠️ 曲の追加・修正について</h3>
                                <p className="font-bold text-base md:text-lg text-black">
                                    新しい曲をリストに足したい時や、曲名を修正したい時は、ご自身で操作せず <span className="text-red-600 border-b-2 border-red-600">スズナ</span> にお願いしてください！
                                </p>
                                <p className="text-xs md:text-sm text-gray-600 mt-2">（スズナがデータベースを更新すると、全員のスマホに自動で反映されます）</p>
                            </div>

                        </div>
                        <div className="p-3 md:p-4 bg-gray-100 border-t border-gray-200 text-center">
                            <button onClick={() => setShowHelp(false)} className="px-8 py-2 md:py-3 bg-gray-800 text-white font-bold rounded-xl active:bg-gray-900 shadow-md">閉じる</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 md:pb-8 print:pb-0">
                    {/* Toast */}
                    {toastMessage && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 animate-fade-in text-sm font-bold print-hidden">
                            {toastMessage}
                        </div>
                    )}

                    {/* ヘルプモーダル */}
                    {showHelp && renderHelpModal()}

                    {/* ヘッダー */}
                    <header className="bg-gray-900 text-white shadow-lg sticky top-0 z-40 print-hidden">
                        <div className="max-w-4xl mx-auto px-3 md:px-4 py-3 md:py-4 flex justify-between items-center">
                            <h1 className="text-lg md:text-2xl font-black tracking-wider flex items-center">
                                🎸 CHICAGO セトリ
                            </h1>
                            <button onClick={() => setShowHelp(true)} className="flex items-center justify-center w-8 h-8 md:w-10 md:h-10 bg-gray-800 rounded-full border-2 border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 active:scale-95 transition-all">
                                <i className="fas fa-question text-sm md:text-lg"></i>
                            </button>
                        </div>
                        
                        {/* タブナビゲーション */}
                        <div className="flex max-w-4xl mx-auto px-2 pb-2 space-x-1">
                            <button onClick={() => setActiveTab('search')} className={`flex-1 py-2 md:py-3 text-[10px] md:text-sm font-bold rounded-lg transition-all ${activeTab === 'search' ? 'bg-white text-gray-900 shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i className="fas fa-search block md:inline md:mr-1 mb-1 md:mb-0 text-sm md:text-base"></i> <span className="hidden md:inline">1. </span>曲を選ぶ
                            </button>
                            <button onClick={() => setActiveTab('edit')} className={`flex-1 py-2 md:py-3 text-[10px] md:text-sm font-bold rounded-lg transition-all ${activeTab === 'edit' ? 'bg-white text-gray-900 shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i className="fas fa-list-ol block md:inline md:mr-1 mb-1 md:mb-0 text-sm md:text-base"></i> <span className="hidden md:inline">2. </span>編集・並替
                            </button>
                            <button onClick={() => setActiveTab('preview')} className={`flex-1 py-2 md:py-3 text-[10px] md:text-sm font-bold rounded-lg transition-all ${activeTab === 'preview' ? 'bg-white text-gray-900 shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i className="fas fa-print block md:inline md:mr-1 mb-1 md:mb-0 text-sm md:text-base"></i> <span className="hidden md:inline">3. </span>印刷
                            </button>
                        </div>
                    </header>

                    {/* メインコンテンツ */}
                    <main className="max-w-4xl mx-auto px-2 md:px-4 pt-4 md:pt-6 print:p-0">
                        {activeTab === 'search' && renderSearchTab()}
                        {activeTab === 'edit' && renderEditTab()}
                        {activeTab === 'preview' && renderPreviewTab()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
