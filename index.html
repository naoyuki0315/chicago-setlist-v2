<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHICAGO Setlist Builder</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (アイコン用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React (アプリの心臓部) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* アニメーションと基本設定 */
        body { -webkit-tap-highlight-color: transparent; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 印刷（A4・1枚）の極限最適化レイアウト */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background-color: white !important; margin: 0 !important; color: black !important; }
            .print-hidden { display: none !important; }
            .print-only { display: flex !important; }
            
            /* 1枚にピタッと収め、行間を最大化する魔法のフレックスボックス */
            #print-container {
                display: flex;
                flex-direction: column;
                height: 270mm; /* A4縦から余白を引いたギリギリの高さ */
                width: 100%;
            }
            .print-header { flex-shrink: 0; margin-bottom: 5mm; }
            .print-table-container {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                border: 2px solid black;
            }
            .print-row {
                display: flex;
                flex-grow: 1; /* 曲数に合わせて行の高さを均等に最大化 */
                border-bottom: 1px solid #444;
                align-items: center; /* 縦の中央揃え */
            }
            .print-row:last-child { border-bottom: none; }
            
            .print-extra { color: #666; font-style: italic; background-color: #f9f9f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;}
        }
        .print-only { display: none; }

        /* 画面上プレビュー＆印刷共通のセル幅とスタイル */
        .print-cell {
            padding: 0 10px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            height: 100%;
            border-right: 1px solid #444;
        }
        .print-cell:last-child { border-right: none; }
        .print-cell-no { width: 8%; justify-content: center; font-size: 1.4rem; }
        .print-cell-title-memo { width: 44%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 5px 10px; }
        .print-cell-key { width: 12%; justify-content: center; font-size: 1.4rem; }
        .print-cell-harp { width: 14%; justify-content: center; font-size: 1.4rem; }
        .print-cell-bpm { width: 10%; justify-content: center; font-size: 1.4rem; }
        .print-cell-time { width: 12%; justify-content: center; font-size: 1.4rem; }
        
        .print-song-title { font-size: 1.6rem; font-weight: bold; width: 100%; line-height: 1.1; }
        .print-song-memo { font-size: 1.1rem; font-weight: normal; margin-top: 4px; color: #333; width: 100%; white-space: pre-wrap; line-height: 1.2;}
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 初期ダミーデータ（CSVが読み込めない時の保険用）
        const FALLBACK_DATA = [
            { 楽曲名: "25 or 6 to 4", Key: "Am", "Harp (Pos)": "", BPM: "150", Time: "4:50", "備考・演奏指示": "" },
            { 楽曲名: "Saturday in the Park", Key: "C", "Harp (Pos)": "C", BPM: "114", Time: "3:56", "備考・演奏指示": "ピアノから" },
            { 楽曲名: "Hard to Say I'm Sorry", Key: "E", "Harp (Pos)": "", BPM: "72", Time: "3:48", "備考・演奏指示": "バラード" },
            { 楽曲名: "If You Leave Me Now", Key: "B", "Harp (Pos)": "", BPM: "100", Time: "3:55", "備考・演奏指示": "" },
            { 楽曲名: "Does Anybody Really Know What Time It Is?", Key: "C", "Harp (Pos)": "", BPM: "112", Time: "4:36", "備考・演奏指示": "ホーンセクション" },
            { 楽曲名: "Beginnings", Key: "A", "Harp (Pos)": "A", BPM: "120", Time: "7:54", "備考・演奏指示": "アコギ" },
            { 楽曲名: "Make Me Smile", Key: "E", "Harp (Pos)": "", BPM: "130", Time: "3:01", "備考・演奏指示": "" },
            { 楽曲名: "Colour My World", Key: "F", "Harp (Pos)": "", BPM: "60", Time: "3:03", "備考・演奏指示": "フルート" },
            { 楽曲名: "Just You 'n' Me", Key: "C", "Harp (Pos)": "", BPM: "90", Time: "3:42", "備考・演奏指示": "" },
            { 楽曲名: "Feelin' Stronger Every Day", Key: "D", "Harp (Pos)": "", BPM: "120", Time: "4:15", "備考・演奏指示": "アップテンポ" }
        ].map((song, i) => ({ ...song, id: `song_${i}` })); // ユニークIDを付与

        // CSVパーサー関数（ダブルクォートや列ズレに対応した強化版）
        const parseCSV = (text) => {
            const parseLine = (line) => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current);
                return result.map(s => s.trim().replace(/^"|"$/g, ''));
            };

            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return [];
            const headers = parseLine(lines[0]);
            
            return lines.slice(1).map((line, idx) => {
                const values = parseLine(line);
                const obj = { id: `csv_${idx}` };
                headers.forEach((header, index) => {
                    obj[header] = values[index] !== undefined ? values[index] : '';
                });
                
                // 列名が何であれ、特定の位置（C列、F列など）のデータを強制取得するフォールバック
                obj['楽曲名'] = obj['楽曲名'] || obj['曲名'] || values[0] || '';
                obj['Key'] = obj['Key'] || obj['キー'] || values[1] || '';
                obj['Time'] = obj['Time'] || obj['時間'] || values[2] || ''; // C列を時間として取得
                obj['Harp (Pos)'] = obj['Harp (Pos)'] || obj['Harp'] || obj['ハーモニカ'] || values[3] || '';
                obj['備考・演奏指示'] = obj['備考・演奏指示'] || obj['備考'] || obj['指示'] || values[4] || '';
                obj['BPM'] = obj['BPM'] || obj['テンポ'] || values[5] || ''; // F列をBPMとして取得
                
                return obj;
            });
        };

        // 時間計算用ヘルパー
        const timeToSeconds = (timeStr) => {
            if (!timeStr) return 0;
            const parts = String(timeStr).split(':');
            if (parts.length === 2) {
                return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            }
            return parseInt(timeStr, 10) || 0;
        };

        const secondsToTime = (seconds) => {
            if (isNaN(seconds) || seconds <= 0) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        };

        const App = () => {
            // ステート管理
            const [activeTab, setActiveTab] = useState('search');
            const [masterData, setMasterData] = useState([]);
            const [setlist, setSetlist] = useState([]);
            const [mainCount, setMainCount] = useState(10);
            const [extraCount, setExtraCount] = useState(3);
            const [toastMessage, setToastMessage] = useState('');
            
            // モーダル管理
            const [showHelp, setShowHelp] = useState(false);
            const [editingNoteIndex, setEditingNoteIndex] = useState(null); // 備考欄編集モーダル用
            const [tempNoteText, setTempNoteText] = useState("");

            // ドラッグ＆ドロップ用参照（PC用）
            const dragItem = useRef(null);
            const dragOverItem = useRef(null);

            // 初回読み込み（GitHub上の master_data.csv を自動フェッチ）
            useEffect(() => {
                fetch('master_data.csv')
                    .then(response => {
                        if (!response.ok) throw new Error('CSVが見つかりません');
                        return response.text();
                    })
                    .then(text => {
                        const data = parseCSV(text);
                        setMasterData(data.length > 0 ? data : FALLBACK_DATA);
                    })
                    .catch(() => {
                        // ローカル実行時やファイル未設置時はフォールバックを使用
                        setMasterData(FALLBACK_DATA);
                    });
            }, []);

            const showToast = (message) => {
                setToastMessage(message);
                setTimeout(() => setToastMessage(''), 3000);
            };

            // 曲の追加・削除トグル
            const toggleSong = (song) => {
                const isSelected = setlist.some(s => s.id === song.id);
                if (isSelected) {
                    setSetlist(setlist.filter(s => s.id !== song.id));
                    showToast(`「${song.楽曲名 || song.曲名}」を削除しました`);
                } else {
                    setSetlist([...setlist, { ...song, uniqueId: Date.now() + Math.random() }]);
                    showToast(`「${song.楽曲名 || song.曲名}」を追加しました`);
                }
            };

            // 編集画面での項目更新
            const updateSetlistField = (index, field, value) => {
                const newList = [...setlist];
                newList[index][field] = value;
                setSetlist(newList);
            };

            // 順番移動（矢印ボタン用 - スマホ）
            const moveRow = (index, direction) => {
                if (direction === -1 && index === 0) return;
                if (direction === 1 && index === setlist.length - 1) return;
                
                const newList = [...setlist];
                const item = newList.splice(index, 1)[0];
                newList.splice(index + direction, 0, item);
                setSetlist(newList);
            };

            // ドラッグ＆ドロップ（PC用）
            const handleSort = () => {
                if (dragItem.current === null || dragOverItem.current === null) return;
                const newList = [...setlist];
                const draggedItem = newList.splice(dragItem.current, 1)[0];
                newList.splice(dragOverItem.current, 0, draggedItem);
                dragItem.current = null;
                dragOverItem.current = null;
                setSetlist(newList);
            };

            // 備考欄モーダルの保存
            const saveNote = () => {
                if (editingNoteIndex !== null) {
                    updateSetlistField(editingNoteIndex, '備考・演奏指示', tempNoteText);
                }
                setEditingNoteIndex(null);
            };

            // 時間の計算
            const calculateTotalTime = () => {
                const mainSongs = setlist.slice(0, mainCount);
                const totalSeconds = mainSongs.reduce((acc, song) => acc + timeToSeconds(song.Time || song.時間), 0);
                return secondsToTime(totalSeconds);
            };

            // 共通コンポーネント：曲数設定
            const renderCountSettings = () => (
                <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
                    <div className="font-bold text-gray-700 flex items-center">
                        <i className="fas fa-music mr-2 text-red-600"></i>
                        現在 {setlist.length} 曲選択中
                    </div>
                    <div className="flex space-x-4">
                        <div className="flex items-center">
                            <label className="text-sm font-bold text-gray-600 mr-2">本番枠:</label>
                            <input type="number" min="1" max="30" value={mainCount} onChange={(e) => setMainCount(Number(e.target.value))} className="w-16 px-2 py-1 border rounded-lg text-center font-bold text-red-600 focus:ring-2 focus:ring-red-200" />
                        </div>
                        <div className="flex items-center">
                            <label className="text-sm font-bold text-gray-600 mr-2">予備枠:</label>
                            <input type="number" min="0" max="10" value={extraCount} onChange={(e) => setExtraCount(Number(e.target.value))} className="w-16 px-2 py-1 border rounded-lg text-center font-bold text-gray-600 focus:ring-2 focus:ring-red-200" />
                        </div>
                    </div>
                </div>
            );

            // --- タブ1: 楽曲選択 (スマホ最適化) ---
            const renderSearchTab = () => (
                <div className="animate-fade-in print-hidden">
                    {renderCountSettings()}
                    
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="bg-red-50 px-4 py-3 border-b border-red-100 flex justify-between items-center">
                            <h2 className="text-sm font-bold text-red-800">マスターデータから選ぶ</h2>
                            <span className="text-xs text-red-600">※タップして追加/削除</span>
                        </div>
                        
                        {/* スマホで12曲ほど見える高さ（約60vh）に設定 */}
                        <div className="overflow-y-auto" style={{ maxHeight: '60vh' }}>
                            <ul className="divide-y divide-gray-100">
                                {masterData.map((song) => {
                                    const isSelected = setlist.some(s => s.id === song.id);
                                    return (
                                        <li key={song.id} 
                                            onClick={() => toggleSong(song)}
                                            className={`p-4 flex items-center justify-between cursor-pointer transition-colors ${isSelected ? 'bg-red-50' : 'hover:bg-gray-50'}`}
                                        >
                                            <div className="flex-1 pr-4">
                                                <div className={`font-bold text-lg ${isSelected ? 'text-red-700' : 'text-gray-800'}`}>
                                                    {song.楽曲名 || song.曲名}
                                                </div>
                                            </div>
                                            <div>
                                                {isSelected ? (
                                                    <button className="px-4 py-2 bg-gray-200 text-gray-600 font-bold rounded-lg text-sm flex items-center shadow-inner">
                                                        <i className="fas fa-check mr-1"></i> 削除
                                                    </button>
                                                ) : (
                                                    <button className="px-4 py-2 bg-red-600 text-white font-bold rounded-lg text-sm flex items-center shadow shadow-red-200 active:bg-red-700">
                                                        <i className="fas fa-plus mr-1"></i> 追加
                                                    </button>
                                                )}
                                            </div>
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>
                    </div>
                </div>
            );

            // --- タブ2: セトリ編集 (ハイブリッド版) ---
            const renderEditTab = () => (
                <div className="animate-fade-in print-hidden">
                    {renderCountSettings()}

                    {setlist.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-xl border border-gray-200">
                            <i className="fas fa-list-ul text-4xl text-gray-300 mb-4"></i>
                            <p className="text-gray-500 font-medium">まだ曲が選ばれていません。<br/>「曲を選ぶ」タブから追加してください。</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {setlist.map((song, index) => {
                                const isExtra = index >= mainCount;
                                return (
                                    <div 
                                        key={song.uniqueId}
                                        draggable
                                        onDragStart={() => (dragItem.current = index)}
                                        onDragEnter={() => (dragOverItem.current = index)}
                                        onDragEnd={handleSort}
                                        onDragOver={(e) => e.preventDefault()}
                                        className={`bg-white border rounded-xl shadow-sm overflow-hidden flex flex-col md:flex-row transition-all relative ${isExtra ? 'border-gray-200 bg-gray-50 opacity-80' : 'border-red-100'}`}
                                    >
                                        {/* 予備境界線（直前に表示） */}
                                        {index === mainCount && (
                                            <div className="absolute -top-3 left-0 w-full flex justify-center z-10 pointer-events-none">
                                                <span className="bg-gray-800 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md">🛑 ここから予備曲</span>
                                            </div>
                                        )}

                                        <div className="flex p-3 items-center">
                                            {/* PC用: ドラッグハンドル (スマホでは非表示) */}
                                            <div className="hidden md:flex text-gray-300 p-2 cursor-grab mr-2">
                                                <i className="fas fa-grip-vertical text-xl"></i>
                                            </div>

                                            {/* スマホ用: 矢印ボタン (PCでは非表示) */}
                                            <div className="md:hidden flex flex-col space-y-1 mr-3">
                                                <button onClick={() => moveRow(index, -1)} disabled={index === 0} className={`p-2 rounded bg-gray-100 text-gray-600 ${index === 0 ? 'opacity-30' : 'active:bg-gray-200'}`}><i className="fas fa-arrow-up"></i></button>
                                                <button onClick={() => moveRow(index, 1)} disabled={index === setlist.length - 1} className={`p-2 rounded bg-gray-100 text-gray-600 ${index === setlist.length - 1 ? 'opacity-30' : 'active:bg-gray-200'}`}><i className="fas fa-arrow-down"></i></button>
                                            </div>

                                            <div className="w-10 text-center font-black text-xl text-gray-400 mr-2">
                                                {isExtra ? '予' : index + 1}
                                            </div>
                                            
                                            <div className="flex-1 font-bold text-lg text-gray-800 leading-tight pr-2">
                                                {song.楽曲名 || song.曲名}
                                            </div>

                                            {/* 行削除（ゴミ箱）ボタン */}
                                            <button 
                                                onClick={() => {
                                                    const newList = setlist.filter((_, i) => i !== index);
                                                    setSetlist(newList);
                                                    showToast(`削除しました`);
                                                }}
                                                className="ml-auto w-10 h-10 flex items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-100 active:bg-red-200 transition-colors"
                                            >
                                                <i className="fas fa-trash-alt"></i>
                                            </button>
                                        </div>

                                        {/* 入力エリア */}
                                        <div className="flex-1 bg-gray-50 p-3 border-t md:border-t-0 md:border-l border-gray-100 grid grid-cols-4 gap-3 items-end">
                                            {/* キー入力 */}
                                            <div className="col-span-1">
                                                <label className="block text-[10px] font-bold text-gray-500 mb-1 text-center">Key</label>
                                                <input type="text" value={song.Key || ''} onChange={(e) => updateSetlistField(index, 'Key', e.target.value)} className="w-full px-1 py-2 border rounded bg-white text-sm font-bold text-center focus:ring-2 focus:ring-red-200 outline-none" />
                                            </div>
                                            {/* ハーモニカ入力 */}
                                            <div className="col-span-1">
                                                <label className="block text-[10px] font-bold text-gray-500 mb-1 text-center">Harp</label>
                                                <input type="text" value={song["Harp (Pos)"] || song.Harp || ''} onChange={(e) => updateSetlistField(index, 'Harp (Pos)', e.target.value)} className="w-full px-1 py-2 border rounded bg-white text-sm font-bold text-center focus:ring-2 focus:ring-red-200 outline-none" />
                                            </div>
                                            {/* BPM入力 */}
                                            <div className="col-span-1">
                                                <label className="block text-[10px] font-bold text-gray-500 mb-1 text-center">BPM</label>
                                                <input type="text" value={song.BPM || ''} onChange={(e) => updateSetlistField(index, 'BPM', e.target.value)} className="w-full px-1 py-2 border rounded bg-white text-sm font-bold text-center focus:ring-2 focus:ring-red-200 outline-none" />
                                            </div>
                                            {/* Time入力 */}
                                            <div className="col-span-1">
                                                <label className="block text-[10px] font-bold text-gray-500 mb-1 text-center">Time</label>
                                                <input type="text" value={song.Time || ''} onChange={(e) => updateSetlistField(index, 'Time', e.target.value)} className="w-full px-1 py-2 border rounded bg-white text-sm font-bold text-center focus:ring-2 focus:ring-red-200 outline-none" />
                                            </div>
                                            {/* 備考（タップで大画面モーダル） */}
                                            <div className="col-span-4">
                                                <label className="block text-[10px] font-bold text-gray-500 mb-1">備考・指示 (タップで拡大)</label>
                                                <div 
                                                    onClick={() => {
                                                        setTempNoteText(song["備考・演奏指示"] || song.備考 || '');
                                                        setEditingNoteIndex(index);
                                                    }}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded bg-white text-sm text-gray-700 truncate cursor-text"
                                                >
                                                    {song["備考・演奏指示"] || song.備考 || <span className="text-gray-400 italic">タップして入力...</span>}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* 備考欄 大画面編集モーダル */}
                    {editingNoteIndex !== null && (
                        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black bg-opacity-60 animate-fade-in p-0 md:p-4 print-hidden">
                            <div className="bg-white w-full md:w-[500px] h-[50vh] md:h-auto md:rounded-2xl rounded-t-2xl flex flex-col shadow-2xl">
                                <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-2xl">
                                    <h3 className="font-bold text-gray-800">
                                        <i className="fas fa-edit mr-2 text-red-600"></i>
                                        備考・演奏指示を編集
                                    </h3>
                                    <button onClick={() => setEditingNoteIndex(null)} className="text-gray-400 hover:text-gray-600 p-2"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <div className="p-4 flex-grow">
                                    <textarea 
                                        value={tempNoteText}
                                        onChange={(e) => setTempNoteText(e.target.value)}
                                        placeholder="ここに演奏の注意点やきっかけを自由に書き込んでください..."
                                        className="w-full h-full p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-red-100 focus:border-red-400 outline-none resize-none text-lg"
                                        autoFocus
                                    ></textarea>
                                </div>
                                <div className="p-4 border-t border-gray-200">
                                    <button onClick={saveNote} className="w-full py-4 bg-red-600 text-white font-bold text-lg rounded-xl active:bg-red-700 shadow-lg flex justify-center items-center">
                                        <i className="fas fa-check-circle mr-2"></i> 保存して閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            // --- タブ3: 印刷・PDFプレビュー ---
            const renderPreviewTab = () => (
                <div className="animate-fade-in">
                    <div className="print-hidden mb-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 text-center">
                            <h2 className="text-2xl font-black text-gray-800 mb-2">準備完了！</h2>
                            <p className="text-gray-600 mb-6">A4用紙1枚に見やすく最適化されたセトリを出力します。</p>
                            
                            <div className="flex justify-center mb-6">
                                <div className="bg-red-50 border border-red-100 rounded-lg p-4 inline-flex items-center space-x-6">
                                    <div>
                                        <span className="block text-xs font-bold text-red-800 opacity-70 mb-1">本番演奏時間 (約)</span>
                                        <span className="text-3xl font-black text-red-600">{calculateTotalTime()}</span>
                                    </div>
                                    <div className="h-10 w-px bg-red-200"></div>
                                    <div>
                                        <span className="block text-xs font-bold text-red-800 opacity-70 mb-1">曲数設定</span>
                                        <span className="text-lg font-bold text-gray-700">本番{mainCount}曲 / 予備{extraCount}曲</span>
                                    </div>
                                </div>
                            </div>

                            <button 
                                onClick={() => window.print()}
                                disabled={setlist.length === 0}
                                className="w-full md:w-auto md:px-12 py-4 bg-red-600 text-white font-bold text-lg rounded-xl shadow-lg hover:bg-red-700 active:scale-95 transition-transform disabled:bg-gray-300 flex items-center justify-center mx-auto"
                            >
                                <i className="fas fa-print mr-2 text-xl"></i>
                                PDFに保存 / 印刷する
                            </button>
                            <p className="text-xs text-gray-500 mt-3 font-bold">※ボタンを押して「PDFとして保存」を選んでLINEで共有してください。</p>
                        </div>

                        {/* --- 画面上の印刷プレビュー --- */}
                        <div className="bg-gray-200 p-4 rounded-xl overflow-x-auto shadow-inner mb-6">
                            <p className="text-center text-sm font-bold text-gray-500 mb-4"><i className="fas fa-eye mr-1"></i> A4用紙 出力プレビュー（横にスクロールできます）</p>
                            <div className="mx-auto bg-white shadow-md text-black font-sans" style={{ width: '210mm', minWidth: '210mm', minHeight: '297mm', padding: '10mm' }}>
                                <div className="text-center border-b-4 border-black pb-2 mb-4">
                                    <h1 className="text-4xl font-black tracking-widest uppercase">LIVE SETLIST - CHICAGO</h1>
                                    <div className="flex justify-between mt-2 font-bold text-lg px-2">
                                        <div>Total Time: {calculateTotalTime()}</div>
                                        <div>Date: ___ / ___ / ______</div>
                                    </div>
                                </div>
                                <div className="flex flex-col border-2 border-black h-[240mm]">
                                    {/* ヘッダー行 */}
                                    <div className="flex bg-gray-200 border-b-2 border-black" style={{ height: '35px' }}>
                                        <div className="print-cell print-cell-no border-r border-gray-800 font-bold">#</div>
                                        <div className="print-cell print-cell-title-memo border-r border-gray-800 font-bold" style={{flexDirection: 'row', alignItems: 'center'}}>楽曲名 / 備考</div>
                                        <div className="print-cell print-cell-key border-r border-gray-800 font-bold">Key</div>
                                        <div className="print-cell print-cell-harp border-r border-gray-800 font-bold">Harp</div>
                                        <div className="print-cell print-cell-bpm border-r border-gray-800 font-bold">BPM</div>
                                        <div className="print-cell print-cell-time font-bold">Time</div>
                                    </div>
                                    {/* データ行 */}
                                    {setlist.slice(0, mainCount + extraCount).map((song, i) => {
                                        const isExtra = i >= mainCount;
                                        return (
                                            <div key={i} className={`flex flex-grow border-b border-gray-400 items-center ${isExtra ? 'bg-gray-50 text-gray-600 italic' : ''} ${i === setlist.slice(0, mainCount + extraCount).length - 1 ? 'border-b-0' : ''}`}>
                                                <div className="print-cell print-cell-no border-r border-gray-400 font-bold text-xl">{isExtra ? '予' : i + 1}</div>
                                                <div className="print-cell print-cell-title-memo border-r border-gray-400">
                                                    <div className="print-song-title">{song.楽曲名 || song.曲名}</div>
                                                    {(song["備考・演奏指示"] || song.備考) && (
                                                        <div className="print-song-memo">
                                                            &gt;&gt;&gt; {song["備考・演奏指示"] || song.備考}
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="print-cell print-cell-key border-r border-gray-400 font-bold text-xl">{song.Key}</div>
                                                <div className="print-cell print-cell-harp border-r border-gray-400 font-bold text-xl">{song["Harp (Pos)"] || song.Harp}</div>
                                                <div className="print-cell print-cell-bpm border-r border-gray-400 font-bold text-xl">{song.BPM}</div>
                                                <div className="print-cell print-cell-time font-bold text-xl">{song.Time || song.時間}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* --- 実際の印刷用 A4フルレイアウト (画面上では隠れ、印刷時のみ展開) --- */}
                    <div className="print-only flex-col w-full h-full bg-white text-black font-sans" id="print-container">
                        <div className="print-header text-center border-b-4 border-black pb-2">
                            <h1 className="text-4xl font-black tracking-widest uppercase">LIVE SETLIST - CHICAGO</h1>
                            <div className="flex justify-between mt-2 font-bold text-lg px-2">
                                <div>Total Time: {calculateTotalTime()}</div>
                                <div>Date: ___ / ___ / ______</div>
                            </div>
                        </div>

                        <div className="print-table-container">
                            {/* ヘッダー行 */}
                            <div className="print-row bg-gray-200 border-b-2 border-black" style={{ flexGrow: 0, height: '35px' }}>
                                <div className="print-cell print-cell-no">#</div>
                                <div className="print-cell print-cell-title-memo" style={{flexDirection: 'row', alignItems: 'center'}}>楽曲名 / 備考</div>
                                <div className="print-cell print-cell-key">Key</div>
                                <div className="print-cell print-cell-harp">Harp</div>
                                <div className="print-cell print-cell-bpm">BPM</div>
                                <div className="print-cell print-cell-time">Time</div>
                            </div>

                            {/* データ行（flex-growで高さ自動最大化） */}
                            {setlist.slice(0, mainCount + extraCount).map((song, i) => {
                                const isExtra = i >= mainCount;
                                return (
                                    <div key={i} className={`print-row ${isExtra ? 'print-extra' : ''}`}>
                                        <div className="print-cell print-cell-no">{isExtra ? '予' : i + 1}</div>
                                        <div className="print-cell print-cell-title-memo">
                                            <div className="print-song-title">{song.楽曲名 || song.曲名}</div>
                                            {(song["備考・演奏指示"] || song.備考) && (
                                                <div className="print-song-memo">
                                                    &gt;&gt;&gt; {song["備考・演奏指示"] || song.備考}
                                                </div>
                                            )}
                                        </div>
                                        <div className="print-cell print-cell-key">{song.Key}</div>
                                        <div className="print-cell print-cell-harp">{song["Harp (Pos)"] || song.Harp}</div>
                                        <div className="print-cell print-cell-bpm">{song.BPM}</div>
                                        <div className="print-cell print-cell-time">{song.Time || song.時間}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            // --- ヘルプモーダル (70歳でもわかる説明) ---
            const renderHelpModal = () => (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-70 p-4 animate-fade-in print-hidden">
                    <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-full">
                        <div className="bg-gray-800 text-white p-4 flex justify-between items-center">
                            <h2 className="text-xl font-bold"><i className="fas fa-question-circle mr-2"></i>使い方の案内</h2>
                            <button onClick={() => setShowHelp(false)} className="text-gray-300 hover:text-white p-2"><i className="fas fa-times text-xl"></i></button>
                        </div>
                        <div className="p-6 overflow-y-auto space-y-6 text-gray-800 text-base leading-relaxed">
                            
                            <div className="bg-red-50 p-4 rounded-xl border border-red-100">
                                <h3 className="font-bold text-red-800 text-lg mb-2">1. セトリの作り方</h3>
                                <ul className="list-disc pl-5 space-y-2">
                                    <li><b>「曲を選ぶ」タブ:</b> 追加ボタンを押して、今日やる曲を選びます。</li>
                                    <li><b>「編集・並べ替え」タブ:</b> ⬆️⬇️矢印ボタンで順番を変えられます。キーやメモもここで書けます。</li>
                                </ul>
                            </div>

                            <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                <h3 className="font-bold text-blue-800 text-lg mb-2">2. メンバーにLINEで送る方法</h3>
                                <ol className="list-decimal pl-5 space-y-2">
                                    <li>「PDF・印刷」タブを開きます。</li>
                                    <li><b>「PDFに保存 / 印刷する」</b>の赤いボタンを押します。</li>
                                    <li>スマホの画面に「PDFとして保存（またはプリント）」と出るので、そのまま保存します。</li>
                                    <li>保存したPDFファイルを、バンドのグループLINEに送れば完了です！</li>
                                </ol>
                            </div>

                            <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-200">
                                <h3 className="font-bold text-yellow-800 text-lg mb-2">⚠️ 曲の追加・修正について</h3>
                                <p className="font-bold text-lg text-black">
                                    新しい曲をリストに足したい時や、曲名を修正したい時は、ご自身で操作せず <span className="text-red-600 border-b-2 border-red-600">スズナさん</span> にお願いしてください！
                                </p>
                                <p className="text-sm text-gray-600 mt-2">（スズナさんがデータベースを更新すると、全員のスマホに自動で反映されます）</p>
                            </div>

                        </div>
                        <div className="p-4 bg-gray-100 border-t border-gray-200 text-center">
                            <button onClick={() => setShowHelp(false)} className="px-8 py-3 bg-gray-800 text-white font-bold rounded-xl active:bg-gray-900 shadow-md">閉じる</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 md:pb-8 print:pb-0">
                    {/* Toast */}
                    {toastMessage && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 animate-fade-in text-sm font-bold print-hidden">
                            {toastMessage}
                        </div>
                    )}

                    {/* ヘルプモーダル */}
                    {showHelp && renderHelpModal()}

                    {/* ヘッダー */}
                    <header className="bg-gray-900 text-white shadow-lg sticky top-0 z-40 print-hidden">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 className="text-xl md:text-2xl font-black tracking-wider flex items-center">
                                🎸 CHICAGO セトリ
                            </h1>
                            <button onClick={() => setShowHelp(true)} className="flex items-center justify-center w-10 h-10 bg-gray-800 rounded-full border-2 border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 active:scale-95 transition-all">
                                <i className="fas fa-question text-lg"></i>
                            </button>
                        </div>
                        
                        {/* タブナビゲーション */}
                        <div className="flex max-w-4xl mx-auto px-2 pb-2 space-x-1">
                            <button onClick={() => setActiveTab('search')} className={`flex-1 py-3 text-xs md:text-sm font-bold rounded-lg transition-all ${activeTab === 'search' ? 'bg-white text-gray-900 shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i className="fas fa-search block md:inline md:mr-1 mb-1 md:mb-0 text-lg md:text-base"></i> <span className="hidden md:inline">1. </span>曲を選ぶ
                            </button>
                            <button onClick={() => setActiveTab('edit')} className={`flex-1 py-3 text-xs md:text-sm font-bold rounded-lg transition-all ${activeTab === 'edit' ? 'bg-white text-gray-900 shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i className="fas fa-list-ol block md:inline md:mr-1 mb-1 md:mb-0 text-lg md:text-base"></i> <span className="hidden md:inline">2. </span>編集・並べ替え
                            </button>
                            <button onClick={() => setActiveTab('preview')} className={`flex-1 py-3 text-xs md:text-sm font-bold rounded-lg transition-all ${activeTab === 'preview' ? 'bg-white text-gray-900 shadow' : 'text-gray-400 hover:bg-gray-800'}`}>
                                <i className="fas fa-print block md:inline md:mr-1 mb-1 md:mb-0 text-lg md:text-base"></i> <span className="hidden md:inline">3. </span>PDF・印刷
                            </button>
                        </div>
                    </header>

                    {/* メインコンテンツ */}
                    <main className="max-w-4xl mx-auto px-3 md:px-4 pt-6 print:p-0">
                        {activeTab === 'search' && renderSearchTab()}
                        {activeTab === 'edit' && renderEditTab()}
                        {activeTab === 'preview' && renderPreviewTab()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
