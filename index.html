<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHICAGO Setlist Builder</title>

    <!-- ホーム画面追加用アイコン設定 -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="theme-color" content="#6c63ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="セトリ作成">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 印刷（A4・1枚）の極限最適化レイアウト */
        @media print {
            @page { 
                size: A4 portrait; 
                margin: 0mm; /* ブラウザ側の余白トラブルを避けるため0に固定 */
            }
            body { 
                background-color: white !important; 
                margin: 0 !important; 
                padding: 10mm !important; /* コンテンツの内側に余白を確保 */
                color: black !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
            }
            .print-hidden { display: none !important; }
            .print-only { display: flex !important; }
            .app-root { min-height: 0 !important; padding-bottom: 0 !important; }
            
            #print-container {
                display: flex;
                flex-direction: column;
                max-height: 262mm; /* 内容が少なければ自然に短くしてよい。超えた場合のみ抑える上限 */
                width: 100%;
                box-sizing: border-box;
                page-break-inside: avoid;
                page-break-after: avoid;
                overflow: hidden; /* 万一はみ出ても2枚目を作らせない最終安全策 */
            }
            .print-header { flex-shrink: 0; margin-bottom: 3mm; }
            .print-table-container {
                display: flex;
                flex-direction: column;
                border: 2px solid black;
                background-color: white;
                overflow: hidden;
            }
            
            .print-extra { color: #555; background-color: #fcfcfc !important; }
        }
        .print-only { display: none; }

        /* --- 指定比率のグリッドレイアウト（IMG_1781.JPG準拠） --- */
        .print-grid-row {
            display: grid;
            grid-template-columns: 6.4% 55.6% 9% 13% 8% 8%;
            grid-template-rows: auto auto; 
            page-break-inside: avoid;
            border-bottom: 1px solid #444;
        }
        .print-grid-row:last-child { border-bottom: none; }
        
        .pg-no { grid-column: 1; grid-row: 1 / 3; display: flex; align-items: flex-start; justify-content: center; border-right: 1px solid #bbb; font-size: calc(1.4rem * var(--cell-scale, 1)); font-weight: bold; padding-top: 4px; }
        .pg-title { grid-column: 2; grid-row: 1; display: flex; align-items: flex-end; justify-content: flex-start; padding: 4px 10px 0 10px; border-right: 1px solid #bbb; text-align: left; }
        .pg-key { grid-column: 3; grid-row: 1; display: flex; align-items: flex-start; justify-content: center; border-right: 1px solid #bbb; font-size: calc(1.3rem * var(--cell-scale, 1)); font-weight: bold; text-align: center; white-space: pre-wrap; padding: 4px 2px 2px; }
        .pg-harp { grid-column: 4; grid-row: 1; display: flex; align-items: flex-start; justify-content: center; border-right: 1px solid #bbb; font-size: calc(1.3rem * var(--cell-scale, 1)); font-weight: bold; text-align: center; padding: 4px 2px 2px; }
        .pg-bpm { grid-column: 5; grid-row: 1; display: flex; align-items: flex-start; justify-content: center; border-right: 1px solid #bbb; font-size: calc(1.3rem * var(--cell-scale, 1)); font-weight: bold; padding-top: 4px; }
        .pg-time { grid-column: 6; grid-row: 1; display: flex; align-items: flex-start; justify-content: center; font-size: calc(1.3rem * var(--cell-scale, 1)); font-weight: bold; padding-top: 4px; }
        
        /* 備考欄：楽曲名の下〜行の右端まで全部使う */
        .pg-memo {
            grid-column: 2 / -1;
            grid-row: 2;
            padding: 2px 10px 4px 10px;
            color: #333;
            text-align: left;
        }
        .pg-memo-text {
            white-space: pre-wrap;
            overflow-wrap: break-word;
            line-height: 1.25;
        }

        /* ヘッダー用 */
        .print-grid-header {
            display: grid;
            grid-template-columns: 6.4% 55.6% 9% 13% 8% 8%;
            background-color: #e5e7eb;
            border-bottom: 2px solid black;
            height: 32px;
            flex-shrink: 0;
        }
        .print-grid-header > div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-right: 1px solid #444;
        }
        .print-grid-header > div:last-child { border-right: none; }

        .print-song-title { font-size: 1.45rem; font-weight: bold; width: 100%; line-height: 1.1; text-align: left; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        const FALLBACK_DATA = [
            { 楽曲名: "Baby Scratch My Back", Key: "E", "Harp (Pos)": "A (2nd)", BPM: "122", Time: "1:35", "備考・演奏指示": ">>> スズナカウント。ハープ以外は3小節目から入る" },
            { 楽曲名: "Messin' With the Kid", Key: "C", "Harp (Pos)": "F (2nd)", BPM: "125", Time: "3:40", "備考・演奏指示": ">>> 今井さんカウント。ラスト合図後、1コーラスやってからケツ繰り" },
            { 楽曲名: "Bad Boy", Key: "A", "Harp (Pos)": "A (1st)", BPM: "72", Time: "4:00", "備考・演奏指示": ">>> ギター始まり。②ソロ：スズナ・グミ①" },
            { 楽曲名: "Key to the Highway", Key: "C", "Harp (Pos)": "F (2nd)", BPM: "78", Time: "3:22", "備考・演奏指示": ">>> 8小節ブルース、スズナ歌の場合ケツから、グミさんカウント（ギター始まり）" },
            { 楽曲名: "Help Me", Key: "Fm", "Harp (Pos)": "Bb (2nd)", BPM: "112", Time: "4:30", "備考・演奏指示": ">>> スズナカウントで開始。スズナソロ1、今井さんソロ2（2コーラス）" }
        ].map((song, i) => ({ ...song, id: `song_${i}` }));

        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTzWOELNEzNkvAb1Nld1Tjzv0_Z5mvRvuQdeH20jy-LYP0cycHgpWcpR6rcSBFqm-5lGKZYLgSmW4cg/pub?gid=842461559&single=true&output=csv";

        const parseCSV = (text) => {
            const parseLine = (line) => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current);
                return result.map(s => s.trim().replace(/^"|"$/g, ''));
            };

            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return [];
            const headers = parseLine(lines[0]);
            
            return lines.slice(1).map((line, idx) => {
                const values = parseLine(line);
                const obj = { id: `csv_${idx}` };
                headers.forEach((header, index) => {
                    obj[header] = values[index] !== undefined ? values[index] : '';
                });
                
                obj['楽曲名'] = obj['楽曲名'] || obj['曲名'] || values[0] || '';
                obj['Key'] = obj['Key'] || obj['キー'] || values[1] || '';
                obj['Time'] = obj['Time'] || obj['時間'] || values[2] || ''; 
                obj['Harp (Pos)'] = obj['Harp (Pos)'] || obj['Harp'] || obj['ハーモニカ'] || values[3] || '';
                obj['備考・演奏指示'] = obj['備考・演奏指示'] || obj['備考'] || obj['指示'] || values[4] || '';
                obj['BPM'] = obj['BPM'] || obj['テンポ'] || values[5] || ''; 
                
                return obj;
            });
        };

        const timeToSeconds = (timeStr) => {
            if (!timeStr) return 0;
            const parts = String(timeStr).split(':');
            if (parts.length === 2) {
                return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            }
            return parseInt(timeStr, 10) || 0;
        };

        const secondsToTime = (seconds) => {
            if (isNaN(seconds) || seconds <= 0) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        };

        const renderHarpCell = (harpText) => {
            if (!harpText) return null;
            const match = harpText.match(/^(.*?)\s*(\(.*?\))$/);
            if (match) {
                return (
                    <div className="flex flex-row items-baseline justify-center whitespace-nowrap">
                        <span className="font-bold">{match[1]}</span>
                        <span style={{ fontSize: '0.7em', marginLeft: '3px' }} className="font-normal">{match[2]}</span>
                    </div>
                );
            }
            return <span>{harpText}</span>;
        };

        // テキストが指定行数を超える場合のみ、省略せずフォントサイズを縮めて収める（短い場合は拡大しない）
        const fitTextShrinkOnly = (el, baseFontSize, maxLines = 2, minFontSize = 6, step = 0.4) => {
            if (!el) return baseFontSize;
            let size = baseFontSize;
            el.style.fontSize = size + 'px';
            let guard = 0;
            while (guard < 60) {
                const lineHeightPx = parseFloat(getComputedStyle(el).lineHeight) || (size * 1.25);
                const maxHeight = lineHeightPx * maxLines + 1;
                if (el.scrollHeight <= maxHeight || size <= minFontSize) break;
                size = Math.max(minFontSize, size - step);
                el.style.fontSize = size + 'px';
                guard++;
            }
            return size;
        };

        // 備考欄：基本サイズのまま表示し、2行を超える場合のみ縮小する（省略はしない／短い備考で文字を拡大しない）
        const AutoFitMemo = ({ text, baseFontSize, maxLines = 2 }) => {
            const ref = useRef(null);
            const [fontSize, setFontSize] = useState(baseFontSize);

            useEffect(() => {
                const el = ref.current;
                if (!el) { return; }
                if (!text) { setFontSize(baseFontSize); return; }
                const finalSize = fitTextShrinkOnly(el, baseFontSize, maxLines);
                setFontSize(finalSize);
            }, [text, baseFontSize, maxLines]);

            return (
                <div
                    ref={ref}
                    className="pg-memo-text"
                    data-autofit="true"
                    data-basesize={baseFontSize}
                    data-maxlines={maxLines}
                    style={{ fontSize: `${fontSize}px` }}
                >
                    {text}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('search');
            const [masterData, setMasterData] = useState([]);
            const [setlist, setSetlist] = useState([]);
            const [mainCount, setMainCount] = useState(10);
            const [extraCount, setExtraCount] = useState(3);
            const [previewScale, setPreviewScale] = useState(1);
            
            const [editingNoteIndex, setEditingNoteIndex] = useState(null);
            const [tempNoteText, setTempNoteText] = useState("");

            const [scrollPos, setScrollPos] = useState({ isTop: true, isBottom: false });
            const scrollContainerRef = useRef(null);

            const dragItem = useRef(null);
            const dragOverItem = useRef(null);
            const previewWrapperRef = useRef(null);

            const handleScroll = (e) => {
                if (!e.target) return;
                const { scrollTop, scrollHeight, clientHeight } = e.target;
                setScrollPos({
                    isTop: scrollTop <= 5,
                    isBottom: Math.ceil(scrollTop + clientHeight) >= scrollHeight - 5
                });
            };

            useEffect(() => {
                if (activeTab === 'search' && scrollContainerRef.current) {
                    handleScroll({ target: scrollContainerRef.current });
                }
            }, [activeTab, masterData, setlist]);

            useEffect(() => {
                const updateScale = () => {
                    if (activeTab === 'preview' && previewWrapperRef.current) {
                        const wrapperWidth = previewWrapperRef.current.clientWidth;
                        const a4WidthPx = 794; 
                        if (wrapperWidth < a4WidthPx) {
                            setPreviewScale(wrapperWidth / a4WidthPx);
                        } else {
                            setPreviewScale(1);
                        }
                    }
                };
                
                setTimeout(updateScale, 10);
                window.addEventListener('resize', updateScale);
                return () => window.removeEventListener('resize', updateScale);
            }, [activeTab]);

            useEffect(() => {
                const timestamp = new Date().getTime();
                fetch(`${SPREADSHEET_CSV_URL}&t=${timestamp}`)
                    .then(response => {
                        if (!response.ok) throw new Error('CSVが見つかりません');
                        return response.text();
                    })
                    .then(text => {
                        const data = parseCSV(text);
                        setMasterData(data.length > 0 ? data : FALLBACK_DATA);
                    })
                    .catch(() => {
                        setMasterData(FALLBACK_DATA);
                    });
            }, []);

            const toggleSong = (song) => {
                const isSelected = setlist.some(s => s.id === song.id);
                if (isSelected) {
                    setSetlist(setlist.filter(s => s.id !== song.id));
                } else {
                    let formattedMemo = song['備考・演奏指示'] || '';
                    if (formattedMemo && !formattedMemo.startsWith('>>>')) {
                        formattedMemo = `>>> ${formattedMemo}`;
                    }
                    setSetlist([...setlist, { ...song, '備考・演奏指示': formattedMemo, uniqueId: Date.now() + Math.random() }]);
                }
            };

            const updateSetlistField = (index, field, value) => {
                const newList = [...setlist];
                newList[index][field] = value;
                setSetlist(newList);
            };

            const moveRow = (index, direction) => {
                if (direction === -1 && index === 0) return;
                if (direction === 1 && index === setlist.length - 1) return;
                
                const itemUniqueId = setlist[index].uniqueId;
                const itemEl = document.getElementById(`song-row-${itemUniqueId}`);
                let prevTop = 0;
                if (itemEl) prevTop = itemEl.getBoundingClientRect().top;

                const newList = [...setlist];
                const item = newList.splice(index, 1)[0];
                newList.splice(index + direction, 0, item);
                setSetlist(newList);

                if (itemEl) {
                    requestAnimationFrame(() => {
                        const newItemEl = document.getElementById(`song-row-${itemUniqueId}`);
                        if (newItemEl) {
                            const newTop = newItemEl.getBoundingClientRect().top;
                            const diff = newTop - prevTop;
                            window.scrollBy(0, diff);
                        }
                    });
                }
            };

            const handleSort = () => {
                if (dragItem.current === null || dragOverItem.current === null) return;
                const newList = [...setlist];
                const draggedItem = newList.splice(dragItem.current, 1)[0];
                newList.splice(dragOverItem.current, 0, draggedItem);
                dragItem.current = null;
                dragOverItem.current = null;
                setSetlist(newList);
            };

            const saveNote = () => {
                if (editingNoteIndex !== null) {
                    let text = tempNoteText;
                    if (text && !text.startsWith('>>>')) {
                        text = `>>> ${text}`;
                    }
                    updateSetlistField(editingNoteIndex, '備考・演奏指示', text);
                }
                setEditingNoteIndex(null);
            };

            const calculateTotalTime = () => {
                const mainSongs = setlist.slice(0, mainCount);
                const totalSeconds = mainSongs.reduce((acc, song) => acc + timeToSeconds(song.Time || song.時間), 0);
                return secondsToTime(totalSeconds);
            };

            const calculateAllSelectedTime = () => {
                const totalSeconds = setlist.reduce((acc, song) => acc + timeToSeconds(song.Time || song.時間), 0);
                return secondsToTime(totalSeconds);
            };

            const handlePrint = () => {
                window.print();
            };

            // 印刷直前(beforeprint)：それまで非表示だった印刷専用コンテナの備考欄を
            // このタイミングで再計測し、2行を超える場合のみ縮小する（省略はしない）
            useEffect(() => {
                const handleBeforePrint = () => {
                    const printMemoEls = document.querySelectorAll('#print-container [data-autofit="true"]');
                    printMemoEls.forEach((el) => {
                        const base = parseFloat(el.dataset.basesize) || 13;
                        const maxLines = parseInt(el.dataset.maxlines, 10) || 2;
                        fitTextShrinkOnly(el, base, maxLines);
                    });
                };
                window.addEventListener('beforeprint', handleBeforePrint);
                return () => window.removeEventListener('beforeprint', handleBeforePrint);
            }, [setlist, mainCount, extraCount]);

            // 曲数に応じてサイズを連続的に拡大縮小（少ない曲数ほど大きく＝余白を減らす）
            // 基準：10曲のときに従来の「9〜12曲」帯と同じ見た目になるよう調整
            const getDynamicDimensions = (totalCount) => {
                const count = Math.max(1, totalCount);
                const rawScale = Math.sqrt(10 / count);
                const scale = Math.min(2.0, Math.max(0.55, rawScale));
                const titleRemValue = 1.4 * scale;
                return {
                    rowHeight: `${(18 * scale).toFixed(1)}mm`,
                    memoSize: titleRemValue * 16 * 0.8, // 備考は曲名の0.8倍に統一
                    titleSize: `${titleRemValue.toFixed(2)}rem`,
                    cellScale: scale,
                };
            };

            const renderCountSettings = () => (
                <div className="bg-gray-50 border border-gray-200 rounded-lg p-2 md:p-4 mb-3 flex flex-col md:flex-row items-center justify-between gap-2">
                    <div className="font-bold text-gray-700 flex items-center text-sm md:text-base">
                        <i className="fas fa-music mr-2 text-red-600"></i>
                        現在 {setlist.length} 曲選択中
                        {setlist.length > 0 && (
                            <span className="ml-2 px-2 py-0.5 bg-red-50 border border-red-200 text-red-600 rounded-md text-xs md:text-sm shadow-sm">
                                計 {calculateAllSelectedTime()}
                            </span>
                        )}
                    </div>
                    <div className="flex space-x-3 md:space-x-4">
                        <div className="flex items-center">
                            <label className="text-xs md:text-sm font-bold text-gray-600 mr-1 md:mr-2">本番枠:</label>
                            <div className="flex items-center border border-gray-300 rounded overflow-hidden shadow-sm bg-white">
                                <button onClick={() => setMainCount(Math.max(1, mainCount - 1))} className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 border-r"><i className="fas fa-minus text-[10px] md:text-xs"></i></button>
                                <div className="w-6 md:w-8 text-center font-bold text-sm md:text-base text-red-600">{mainCount}</div>
                                <button onClick={() => setMainCount(Math.min(30, mainCount + 1))} className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 border-l"><i className="fas fa-plus text-[10px] md:text-xs"></i></button>
                            </div>
                        </div>
                        <div className="flex items-center">
                            <label className="text-xs md:text-sm font-bold text-gray-600 mr-1 md:mr-2">予備枠:</label>
                            <div className="flex items-center border border-gray-300 rounded overflow-hidden shadow-sm bg-white">
                                <button onClick={() => setExtraCount(Math.max(0, extraCount - 1))} className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 border-r"><i className="fas fa-minus text-[10px] md:text-xs"></i></button>
                                <div className="w-6 md:w-8 text-center font-bold text-sm md:text-base text-gray-600">{extraCount}</div>
                                <button onClick={() => setExtraCount(Math.min(10, extraCount + 1))} className="px-2 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-600 border-l"><i className="fas fa-plus text-[10px] md:text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderSearchTab = () => (
                <div className="animate-fade-in print-hidden relative">
                    {renderCountSettings()}
                    
                    <div className="fixed right-3 md:right-5 top-[40%] transform -translate-y-1/2 flex flex-col gap-3 z-50">
                        {!scrollPos.isTop && (
                            <button 
                                onClick={() => scrollContainerRef.current?.scrollTo({ top: 0, behavior: 'smooth' })} 
                                className="bg-gray-800 bg-opacity-70 hover:bg-opacity-100 text-white p-2.5 rounded-xl shadow-2xl flex flex-col items-center transition-all border border-gray-600 backdrop-blur-sm"
                            >
                                <i className="fas fa-chevron-up text-xl mb-1"></i>
                                <span className="text-[10px] font-bold leading-tight">一番上へ</span>
                                <span className="text-[11px] font-black text-red-300 leading-tight mt-1 whitespace-nowrap">
                                    計 {calculateAllSelectedTime()}
                                </span>
                            </button>
                        )}
                        
                        {!scrollPos.isBottom && (
                            <button 
                                onClick={() => scrollContainerRef.current?.scrollTo({ top: scrollContainerRef.current.scrollHeight, behavior: 'smooth' })} 
                                className="bg-gray-800 bg-opacity-70 hover:bg-opacity-100 text-white p-2.5 rounded-xl shadow-2xl flex flex-col items-center transition-all border border-gray-600 backdrop-blur-sm"
                            >
                                <span className="text-[10px] font-bold leading-tight mb-1">一番下へ</span>
                                <i className="fas fa-chevron-down text-xl"></i>
                            </button>
                        )}
                    </div>

                    <div className="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
                        <div className="bg-red-50 px-3 py-2 border-b border-red-100 flex justify-between items-center">
                            <h2 className="text-xs md:text-sm font-bold text-red-800">マスターデータから選ぶ</h2>
                            <span className="text-[10px] md:text-xs text-red-600">※タップして追加/削除</span>
                        </div>
                        
                        <div 
                            className="overflow-y-auto" 
                            style={{ maxHeight: '65vh' }}
                            ref={scrollContainerRef}
                            onScroll={handleScroll}
                        >
                            <ul className="divide-y divide-gray-100">
                                {masterData.map((song) => {
                                    const isSelected = setlist.some(s => s.id === song.id);
                                    return (
                                        <li key={song.id} 
                                            onClick={() => toggleSong(song)}
                                            className={`px-3 py-1.5 md:p-3 flex items-center justify-start cursor-pointer transition-colors ${isSelected ? 'bg-red-50' : 'hover:bg-gray-50'}`}
                                        >
                                            <div className="mr-2 md:mr-3 flex-shrink-0 w-16 md:w-20">
                                                {isSelected ? (
                                                    <button className="w-full px-1 py-1 md:px-2 bg-gray-200 text-gray-600 font-bold rounded text-xs flex justify-center items-center shadow-inner">
                                                        <i className="fas fa-check mr-1"></i> 削除
                                                    </button>
                                                ) : (
                                                    <button className="w-full px-1 py-1 md:px-2 bg-red-600 text-white font-bold rounded text-xs flex justify-center items-center shadow shadow-red-200 active:bg-red-700">
                                                        <i className="fas fa-plus mr-1"></i> 追加
                                                    </button>
                                                )}
                                            </div>
                                            <div className="flex-1 text-left">
                                                <div className={`font-bold text-sm md:text-base truncate ${isSelected ? 'text-red-700' : 'text-gray-800'}`}>
                                                    {song.楽曲名 || song.曲名}
                                                </div>
                                            </div>
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>
                    </div>
                </div>
            );

            const renderEditTab = () => (
                <div className="animate-fade-in print-hidden">
                    {renderCountSettings()}

                    {setlist.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-lg border border-gray-200">
                            <i className="fas fa-list-ul text-3xl text-gray-300 mb-3"></i>
                            <p className="text-gray-500 font-medium text-sm">まだ曲が選ばれていません。<br/>「1. 曲を選ぶ」タブから追加してください。</p>
                        </div>
                    ) : (
                        <div className="space-y-1">
                            {setlist.map((song, index) => {
                                const isExtra = index >= mainCount;
                                return (
                                    <React.Fragment key={song.uniqueId}>
                                        {index === mainCount && (
                                            <div className="w-full flex justify-center py-1.5 print-hidden">
                                                <span className="bg-gray-800 text-white text-[10px] font-bold px-3 py-0.5 rounded-full shadow-md">🛑 ここから予備曲</span>
                                            </div>
                                        )}

                                        <div 
                                            id={`song-row-${song.uniqueId}`}
                                            draggable
                                            onDragStart={() => (dragItem.current = index)}
                                            onDragEnter={() => (dragOverItem.current = index)}
                                            onDragEnd={handleSort}
                                            onDragOver={(e) => e.preventDefault()}
                                            className={`bg-white border rounded shadow-sm overflow-hidden flex flex-col transition-all ${isExtra ? 'border-gray-200 bg-gray-50 opacity-80' : 'border-red-100'}`}
                                        >
                                            <div className="p-0.5 md:p-2 flex flex-col md:flex-row gap-0 md:gap-2 items-start md:items-end">
                                                <div className="flex items-center w-full md:w-auto md:flex-1 py-0.5 md:py-0">
                                                    <div className="hidden md:flex text-gray-300 p-1 cursor-grab mr-1">
                                                        <i className="fas fa-grip-vertical text-lg"></i>
                                                    </div>

                                                    <div className="md:hidden flex flex-col space-y-0 mr-1">
                                                        <button onClick={() => moveRow(index, -1)} disabled={index === 0} className={`px-1.5 py-0 rounded bg-gray-100 text-gray-600 ${index === 0 ? 'opacity-30' : 'active:bg-gray-200'}`}><i className="fas fa-arrow-up text-[8px]"></i></button>
                                                        <button onClick={() => moveRow(index, 1)} disabled={index === setlist.length - 1} className={`px-1.5 py-0 rounded bg-gray-100 text-gray-600 ${index === setlist.length - 1 ? 'opacity-30' : 'active:bg-gray-200'}`}><i className="fas fa-arrow-down text-[8px]"></i></button>
                                                    </div>

                                                    <div className="w-5 flex-shrink-0 text-center font-black text-xs md:text-base text-gray-400 mr-1">
                                                        {isExtra ? '予' : index + 1}
                                                    </div>
                                                    
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setSetlist(setlist.filter((_, i) => i !== index));
                                                        }}
                                                        className="flex-shrink-0 w-6 h-6 md:w-8 md:h-8 flex items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-100 active:bg-red-200 transition-colors mr-1 md:mr-2"
                                                    >
                                                        <i className="fas fa-trash-alt text-[10px] md:text-xs"></i>
                                                    </button>
                                                    
                                                    <div className="flex-1 font-bold text-sm md:text-base text-gray-800 leading-none pr-1 truncate text-left">
                                                        {song.楽曲名 || song.曲名}
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-[15fr_56fr_12fr_17fr] md:flex items-end gap-0.5 w-full md:w-auto px-1 md:px-0 mb-0.5 md:mb-0">
                                                    <div className="md:w-10">
                                                        <label className="block text-[8px] md:text-[9px] font-bold text-gray-500 mb-0 md:mb-0.5 text-center leading-none">Key</label>
                                                        <input type="text" value={song.Key || ''} onChange={(e) => updateSetlistField(index, 'Key', e.target.value)} className="w-full px-0.5 py-0 md:py-1 border rounded bg-white text-[9px] md:text-xs font-bold text-center focus:ring-2 focus:ring-red-200 outline-none h-4 md:h-auto leading-none" />
                                                    </div>
                                                    <div className="md:w-16">
                                                        <label className="block text-[8px] md:text-[9px] font-bold text-gray-500 mb-0 md:mb-0.5 text-center leading-none">Harp</label>
                                                        <input type="text" value={song["Harp (Pos)"] || song.Harp || ''} onChange={(e) => updateSetlistField(index, 'Harp (Pos)', e.target.value)} className="w-full px-0.5 py-0 md:py-1 border rounded bg-white text-[9px] md:text-xs font-bold text-center focus:ring-2 focus:ring-red-200 outline-none h-4 md:h-auto leading-none" />
                                                    </div>
                                                    <div className="md:w-12">
                                                        <label className="block text-[8px] md:text-[9px] font-bold text-gray-500 mb-0 md:mb-0.5 text-center leading-none">BPM</label>
                                                        <input type="text" value={song.BPM || ''} onChange={(e) => updateSetlistField(index, 'BPM', e.target.value)} className="w-full px-0.5 py-0 md:py-1 border rounded bg-white text-[9px] md:text-xs font-bold text-center focus:ring-2 focus:ring-red-200 outline-none h-4 md:h-auto leading-none" />
                                                    </div>
                                                    <div className="md:w-14">
                                                        <label className="block text-[8px] md:text-[9px] font-bold text-gray-500 mb-0 md:mb-0.5 text-center leading-none">Time</label>
                                                        <input type="text" value={song.Time || song.時間 || ''} onChange={(e) => updateSetlistField(index, 'Time', e.target.value)} className="w-full px-0.5 py-0 md:py-1 border rounded bg-white text-[9px] md:text-xs font-bold text-center focus:ring-2 focus:ring-red-200 outline-none h-4 md:h-auto leading-none" />
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="px-2 py-1 bg-gray-50 border-t border-gray-100 flex items-center justify-between gap-2">
                                                {editingNoteIndex === index ? (
                                                    <div className="flex-1 flex gap-1 items-center">
                                                        <input type="text" value={tempNoteText} onChange={(e) => setTempNoteText(e.target.value)} className="flex-1 px-2 py-0.5 text-xs border rounded bg-white" placeholder="備考・演奏指示を入力..." />
                                                        <button onClick={saveNote} className="px-3 py-0.5 bg-green-600 text-white text-xs font-bold rounded shadow">保存</button>
                                                        <button onClick={() => setEditingNoteIndex(null)} className="px-2 py-0.5 bg-gray-400 text-white text-xs font-bold rounded shadow">キャンセル</button>
                                                    </div>
                                                ) : (
                                                    <div className="flex-1 flex items-center justify-between text-left">
                                                        <span className="text-xs text-gray-600 truncate max-w-[70vw]">
                                                            <i className="far fa-comment-dots mr-1 text-gray-400"></i>
                                                            {song['備考・演奏指示'] || <span className="text-gray-300 italic">指示なし</span>}
                                                        </span>
                                                        <button 
                                                            onClick={() => {
                                                                setEditingNoteIndex(index);
                                                                setTempNoteText(song['備考・演奏指示'] || "");
                                                            }} 
                                                            className="text-xs text-blue-600 font-bold hover:underline ml-2"
                                                        >
                                                            編集
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </React.Fragment>
                                );
                            })}
                        </div>
                    )}
                </div>
            );

            const renderPreviewTab = () => {
                const mainSongs = setlist.slice(0, mainCount);
                const extraSongs = setlist.slice(mainCount, mainCount + extraCount);
                const totalPrintedCount = mainSongs.length + extraSongs.length;
                
                const dims = getDynamicDimensions(totalPrintedCount);
                const dynamicRowStyle = {
                    '--cell-scale': dims.cellScale
                };

                return (
                    <div className="animate-fade-in print-hidden flex flex-col items-center">
                        <div className="w-full max-w-4xl flex justify-between items-center bg-white p-3 rounded-lg border border-gray-200 mb-4 shadow-sm">
                            <div className="text-left">
                                <span className="text-xs text-gray-500 block font-bold">印刷プレビュー表示</span>
                                <span className="text-sm font-bold text-gray-700">A4・1枚最適化（合計: {totalPrintedCount}曲）</span>
                            </div>
                            <button onClick={handlePrint} className="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-bold px-5 py-2 rounded-xl shadow-lg flex items-center gap-2 transform active:scale-95 transition-all">
                                <i className="fas fa-print"></i> 印刷する / PDF保存
                            </button>
                        </div>

                        <div ref={previewWrapperRef} className="w-full bg-gray-300 p-2 md:p-6 rounded-xl border border-gray-400 shadow-inner overflow-hidden flex justify-center">
                            <div 
                                style={{ 
                                    transform: `scale(${previewScale})`, 
                                    transformOrigin: 'top center',
                                    width: '794px',
                                    minHeight: '1123px',
                                    backgroundColor: 'white',
                                    color: 'black',
                                    padding: '10mm',
                                    boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)'
                                }}
                                className="flex flex-col text-black font-sans"
                            >
                                <div className="border-b-[3px] border-black pb-1.5 mb-3">
                                    <div className="text-center">
                                        <h1 className="text-xl font-black tracking-widest uppercase" style={{ fontFamily: 'Arial Black, Helvetica, sans-serif' }}>LIVE SETLIST - CHICAGO</h1>
                                    </div>
                                    <div className="flex justify-between items-end mt-1 text-[11px] font-bold text-gray-800 px-1">
                                        <div>本番曲のTotal Time: <span className="underline ml-0.5">{calculateTotalTime()}</span></div>
                                        <div className="tracking-wider">Date:_______ /_______ /_______</div>
                                    </div>
                                </div>

                                <div className="flex-grow flex flex-col border-2 border-black overflow-hidden bg-white">
                                    <div className="print-grid-header">
                                        <div>#</div>
                                        <div className="justify-start pl-[10px]">楽曲名</div>
                                        <div>Key</div>
                                        <div>Harp</div>
                                        <div>BPM</div>
                                        <div>Time</div>
                                    </div>

                                    {mainSongs.map((song, i) => (
                                        <div key={`print-main-${i}`} className="print-grid-row" style={dynamicRowStyle}>
                                            <div className="pg-no">{i + 1}</div>
                                            <div className="pg-title"><div className="print-song-title truncate" style={{ fontSize: dims.titleSize }}>{song.楽曲名 || song.曲名}</div></div>
                                            <div className="pg-key">{song.Key || '-'}</div>
                                            <div className="pg-harp">{renderHarpCell(song["Harp (Pos)"] || song.Harp)}</div>
                                            <div className="pg-bpm">{song.BPM || '-'}</div>
                                            <div className="pg-time">{song.Time || song.時間 || '-'}</div>
                                            <div className="pg-memo"><AutoFitMemo text={song['備考・演奏指示'] || ''} baseFontSize={dims.memoSize} /></div>
                                        </div>
                                    ))}

                                    {extraSongs.map((song, i) => (
                                        <div key={`print-extra-${i}`} className="print-grid-row print-extra" style={dynamicRowStyle}>
                                            <div className="pg-no">予</div>
                                            <div className="pg-title"><div className="print-song-title truncate" style={{ fontSize: dims.titleSize }}>{song.楽曲名 || song.曲名}</div></div>
                                            <div className="pg-key">{song.Key || '-'}</div>
                                            <div className="pg-harp">{renderHarpCell(song["Harp (Pos)"] || song.Harp)}</div>
                                            <div className="pg-bpm">{song.BPM || '-'}</div>
                                            <div className="pg-time">{song.Time || song.時間 || '-'}</div>
                                            <div className="pg-memo"><AutoFitMemo text={song['備考・演奏指示'] || ''} baseFontSize={dims.memoSize} /></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const totalPrintedCount = setlist.slice(0, mainCount).length + setlist.slice(mainCount, mainCount + extraCount).length;
            const dims = getDynamicDimensions(totalPrintedCount);

            return (
                <div className="min-h-screen pb-24 md:pb-6 app-root">
                    <header className="bg-slate-900 text-white shadow-xl border-b-2 border-red-600 sticky top-0 z-40 print-hidden">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-gradient-to-br from-red-600 to-red-800 p-2 rounded-xl shadow-inner border border-red-500">
                                    <i className="fas fa-bolt text-lg text-yellow-300 animate-pulse"></i>
                                </div>
                                <div className="text-left">
                                    <h1 className="text-sm md:text-lg font-black tracking-wider leading-none text-red-500" style={{ fontFamily: 'Impact, sans-serif' }}>DROP DOWN MAMA</h1>
                                    <p className="text-[10px] md:text-xs font-bold text-slate-400 mt-1">CHICAGO Setlist Builder</p>
                                </div>
                            </div>
                            <div className="flex space-x-1 bg-slate-800 p-1 rounded-xl border border-slate-700">
                                <button onClick={() => setActiveTab('search')} className={`px-2.5 py-1.5 md:px-4 md:py-2 text-xs font-bold rounded-lg transition-all flex items-center ${activeTab === 'search' ? 'bg-red-600 text-white shadow-md shadow-red-900/50' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="fas fa-search mr-1 md:mr-1.5"></i>曲を選ぶ
                                </button>
                                <button onClick={() => setActiveTab('edit')} className={`px-2.5 py-1.5 md:px-4 md:py-2 text-xs font-bold rounded-lg transition-all flex items-center ${activeTab === 'edit' ? 'bg-red-600 text-white shadow-md shadow-red-900/50' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="fas fa-sliders-h mr-1 md:mr-1.5"></i>組む ({setlist.length})
                                </button>
                                <button onClick={() => setActiveTab('preview')} className={`px-2.5 py-1.5 md:px-4 md:py-2 text-xs font-bold rounded-lg transition-all flex items-center ${activeTab === 'preview' ? 'bg-red-600 text-white shadow-md shadow-red-900/50' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="fas fa-print mr-1 md:mr-1.5"></i>プレビュー
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-2 md:px-4 py-4">
                        {activeTab === 'search' && renderSearchTab()}
                        {activeTab === 'edit' && renderEditTab()}
                        {activeTab === 'preview' && renderPreviewTab()}
                    </main>

                    {/* 実際の印刷用コンテナ */}
                    <div id="print-container" className="print-only">
                        <div className="print-header border-b-[3px] border-black pb-1.5 mb-2">
                            <div className="text-center">
                                <h1 className="text-xl font-black tracking-widest uppercase" style={{ fontFamily: 'Arial Black, Helvetica, sans-serif' }}>LIVE SETLIST - CHICAGO</h1>
                            </div>
                            <div className="flex justify-between items-end mt-1 text-[11px] font-bold text-gray-800 px-1">
                                <div>本番曲のTotal Time: <span className="underline ml-0.5">{calculateTotalTime()}</span></div>
                                <div className="tracking-wider">Date:_______ /_______ /_______</div>
                            </div>
                        </div>

                        <div className="print-table-container">
                            <div className="print-grid-header">
                                <div>#</div>
                                <div className="justify-start pl-[10px]">楽曲名</div>
                                <div>Key</div>
                                <div>Harp</div>
                                <div>BPM</div>
                                <div>Time</div>
                            </div>

                            {setlist.slice(0, mainCount).map((song, i) => (
                                <div key={`print-real-main-${i}`} className="print-grid-row" style={{ '--cell-scale': dims.cellScale }}>
                                    <div className="pg-no">{i + 1}</div>
                                    <div className="pg-title"><div className="print-song-title truncate" style={{ fontSize: dims.titleSize }}>{song.楽曲名 || song.曲名}</div></div>
                                    <div className="pg-key">{song.Key || '-'}</div>
                                    <div className="pg-harp">{renderHarpCell(song["Harp (Pos)"] || song.Harp)}</div>
                                    <div className="pg-bpm">{song.BPM || '-'}</div>
                                    <div className="pg-time">{song.Time || song.時間 || '-'}</div>
                                    <div className="pg-memo"><AutoFitMemo text={song['備考・演奏指示'] || ''} baseFontSize={dims.memoSize} /></div>
                                </div>
                            ))}

                            {setlist.slice(mainCount, mainCount + extraCount).map((song, i) => (
                                <div key={`print-real-extra-${i}`} className="print-grid-row print-extra" style={{ '--cell-scale': dims.cellScale }}>
                                    <div className="pg-no">予</div>
                                    <div className="pg-title"><div className="print-song-title truncate" style={{ fontSize: dims.titleSize }}>{song.楽曲名 || song.曲名}</div></div>
                                    <div className="pg-key">{song.Key || '-'}</div>
                                    <div className="pg-harp">{renderHarpCell(song["Harp (Pos)"] || song.Harp)}</div>
                                    <div className="pg-bpm">{song.BPM || '-'}</div>
                                    <div className="pg-time">{song.Time || song.時間 || '-'}</div>
                                    <div className="pg-memo"><AutoFitMemo text={song['備考・演奏指示'] || ''} baseFontSize={dims.memoSize} /></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
